  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

<script>

<script type="text/babel" data-presets="react">
/* =====================================================================
   Auftragsübersicht Schweißerei
   ---------------------------------------------------------------------
   Eine Datei, keine Installation. Daten liegen in Supabase im Schema
   `werkstatt` (siehe Schweisserei-Supabase-Setup.sql).
   ===================================================================== */

/* ---------- Einstellungen ------------------------------------------- */

const SUPABASE_URL = "https://vmxucwenjpwrjpeqcuhc.supabase.co";
const SUPABASE_KEY = "sb_publishable_bKycBdawzkSItE7G0YVamQ_ikkJMm0j";

/* PIN vor der Anwendung. Gleicher Wert wie im Artikelmanager, damit sich

/* Fällt weg, sobald jemand einen anderen Bereich wählt - dient nur als

const BUCKET  = "werkstatt-belege";

/* Aufbau des Boards. `archiviert` taucht hier bewusst nicht auf -

/* Wo eine Kachel landet, entscheidet die Datenbank (bereich_status) -

const SPALTEN = [

    leer: "Nichts angekündigt" },

    leer: "Noch nichts fertig" }
];

const STATUS_TEXT = {
  neu: "Neu",
  in_arbeit: "In Arbeit",
  abgeschlossen: "Erledigt",
  archiviert: "Archiviert"
};

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {

});

const { useState, useEffect, useCallback, useMemo, useRef } = React;


/* ---------- Kleine Helfer ------------------------------------------- */

/** 135 -> "2:15 h", 45 -> "45 min" */
function minutenText(min) {
  min = Number(min) || 0;
  if (min < 60) return min + " min";
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h + ":" + String(m).padStart(2, "0") + " h";
}

function datumText(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
}

/** "2026-09-28" -> "Mo 28.09." - kurz genug für die Kachel. */
function tagText(datum) {
  if (!datum) return "";
  const d = new Date(datum + "T00:00:00");
  const wochentag = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"][d.getDay()];
  return wochentag + " " + String(d.getDate()).padStart(2, "0") + "." +
         String(d.getMonth() + 1).padStart(2, "0") + ".";
}

/** Der Zeitraum, in dem das Fahrzeug vor Ort ist, als eine Zeile. */
function zeitraumText(von, bis) {
  if (!von && !bis) return "kein Termin";
  if (von && bis)   return tagText(von) + " – " + tagText(bis);
  if (von)          return "ab " + tagText(von);
  return "bis " + tagText(bis);
}

function datumZeitText(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + ", " +
         d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

/** Dateinamen für Supabase Storage entschärfen (keine Umlaute, Leerzeichen). */
function dateiNameSauber(name) {
  return name
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .replace(/Ä/g, "Ae").replace(/Ö/g, "Oe").replace(/Ü/g, "Ue")
    .replace(/[^a-zA-Z0-9._-]/g, "_");
}

/**
 * Zerlegt einen eingefügten Positionsblock zeilenweise.
 * Erkennt "2 Stk Konsole 40x40" und "Konsole 40x40". Bewusst simpel -
 * die Zeilen bleiben danach editierbar, Korrektur von Hand ist maßgeblich.
 */
function zerlegeBlock(text) {
  return text
    .split(/\r?\n/)
    .map(z => z.trim())
    .filter(z => z.length > 0)
    .map(zeile => {
      const m = zeile.match(/^(\d+(?:[.,]\d+)?)\s*(stk|st|x|m|mm|kg|lfm|m2|m²|set)?\s+(.+)$/i);
      if (m && m[3] && m[3].trim().length > 1) {
        return {
          menge: m[1].replace(",", "."),
          einheit: m[2] ? m[2] : "Stk",
          bezeichnung: m[3].trim(),
          ist_fertigung: true
        };
      }
      return { menge: "1", einheit: "Stk", bezeichnung: zeile, ist_fertigung: true };
    });
}


/* =====================================================================
   PDF auslesen (Claude)
   ---------------------------------------------------------------------
   Gleiches Vorgehen wie in MV-Artikelnummer/app/wareneingang.html:
   Datei direkt an die Anthropic-API, Antwort gegen ein festes Schema.
   Das Ergebnis ist ein VORSCHLAG - er landet in der editierbaren
   Positionsliste, korrigiert wird von Hand.
   ===================================================================== */

const CLAUDE_MODEL = "claude-sonnet-5";
const KEY_SPEICHER = "anthropic_api_key";

const BELEG_SCHEMA = {
  type: "object",
  properties: {
    beleg_nr: { type: "string", description: "Belegnummer bzw. Lieferschein-Nr. des Belegs, sonst ''" },
    kunde:    { type: "string", description: "Name des Kunden bzw. Empfängers, sonst ''" },
    fahrzeug: { type: "string", description: "Fahrzeug, Fahrzeugtyp oder Kennzeichen, falls auf dem Beleg genannt, sonst ''" },
    positionen: {
      type: "array",
      items: {
        type: "object",
        properties: {
          bezeichnung: { type: "string", description: "Bezeichnung der Position, so wie sie auf dem Beleg steht" },
          menge:       { type: "string", description: "Menge als Zahl ohne Einheit, sonst '1'" },
          einheit:     { type: "string", description: "Einheit, z. B. Stk, m, kg. Wenn keine genannt: 'Stk'" },
          art: {
            type: "string",
            enum: ["fertigung", "zukauf"],
            description: "'zukauf' nur bei eindeutig zugekauftem Fertigteil/Material, das nur beigestellt wird. Im Zweifel immer 'fertigung'."
          }
        },
        required: ["bezeichnung"],
        additionalProperties: false
      }
    }
  },
  required: ["positionen"],
  additionalProperties: false
};

const BELEG_PROMPT =
  "Dies ist ein WSA-Beleg der Schweißerei (technisch ein Lieferschein aus Lexware, evtl. mehrere Seiten). " +
  "Extrahiere die Belegnummer, den Kunden, falls genannt das Fahrzeug, und ALLE echten Arbeits- bzw. Warenpositionen.\n\n" +
  "Pro Position: 'bezeichnung' wortgetreu vom Beleg, 'menge' als reine Zahl, 'einheit' getrennt davon.\n\n" +
  "Zu 'art': Die Schweißerei fertigt selbst. Setze 'zukauf' nur, wenn eine Position eindeutig ein zugekauftes " +
  "Fertigteil oder Material ist, an dem nicht gearbeitet wird. Bei jeder Unsicherheit 'fertigung' setzen - " +
  "eine falsch als Zukauf markierte Position würde die Stundenerfassung unterschlagen.\n\n" +
  "KEINE Positionen aufnehmen, die keine Leistung oder Ware sind - also weder Rabatt, Skonto, Nachlass, " +
  "Gutschrift, noch Versand, Fracht, Anlieferung, Transport, Anfahrt, Porto, Verpackung, Palette, Pfand, " +
  "Mindermengenzuschlag oder Bearbeitungsgebühr. Ebenso keine Zwischensumme, Gesamtsumme, Netto, Brutto, " +
  "MwSt./Steuer und keine Kopf- oder Fußzeilen.";

function warte(ms) { return new Promise(r => setTimeout(r, ms)); }

/** Datei in einen Inhaltsblock für die API verwandeln. PDFs gehen direkt. */
function dateiZuInhalt(f) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve({
      type: "document",
      source: { type: "base64", media_type: "application/pdf", data: String(r.result).split(",")[1] }
    });
    r.onerror = reject;
    r.readAsDataURL(f);
  });
}

async function leseBelegAus(apiKey, datei, beiWiederholung) {
  const inhalt = [await dateiZuInhalt(datei), { type: "text", text: BELEG_PROMPT }];
  const body = {
    model: CLAUDE_MODEL,
    max_tokens: 8000,
    system: "Du bist ein präziser Assistent für Beleg-Extraktion. Antworte ausschließlich mit dem geforderten JSON.",
    messages: [{ role: "user", content: inhalt }],
    output_config: { format: { type: "json_schema", schema: BELEG_SCHEMA } }
  };

  const MAX = 4, pausen = [1200, 2500, 4500];
  let letzterFehler = null;

  for (let versuch = 1; versuch <= MAX; versuch++) {
    let antwort = null;
    try {
      antwort = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify(body)
      });
    } catch (e) {
      letzterFehler = new Error("Netzwerkfehler beim Aufruf. Besteht eine Internetverbindung?");
      if (versuch < MAX) { beiWiederholung && beiWiederholung(versuch + 1, MAX); await warte(pausen[versuch - 1]); continue; }
      throw letzterFehler;
    }

    const json = await antwort.json().catch(() => null);

    if (antwort.ok) {
      const teile = (json && Array.isArray(json.content)) ? json.content : [];
      let text = teile.filter(b => b.type === "text").map(b => b.text || "").join("").trim();
      if (!text) throw new Error("Keine Antwort erhalten.");
      if (text.includes("```")) {
        const m = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/);
        if (m && m[1]) text = m[1].trim();
      }
      return JSON.parse(text);
    }

    const meldung = (json && json.error && json.error.message) || ("HTTP " + antwort.status);
    const voruebergehend = antwort.status === 429 || antwort.status === 529 ||
                           antwort.status >= 500 || /overloaded/i.test(meldung);
    if (voruebergehend && versuch < MAX) {
      beiWiederholung && beiWiederholung(versuch + 1, MAX);
      await warte(pausen[versuch - 1]);
      continue;
    }
    if (antwort.status === 401) throw new Error("Ungültiger API-Key (beginnt mit sk-ant-…).");
    if (antwort.status === 400 && /credit|balance|billing/i.test(meldung))
      throw new Error("Kein Guthaben auf dem Anthropic-Konto.");
    if (antwort.status === 429) throw new Error("Zu viele Anfragen — bitte kurz warten.");
    if (antwort.status === 529 || /overloaded/i.test(meldung))
      throw new Error("Claude ist gerade überlastet — bitte gleich noch einmal.");
    throw new Error(meldung);
  }
  throw letzterFehler || new Error("Auslesen fehlgeschlagen.");
}


/* ---------- Bausteine ----------------------------------------------- */

function Knopf({ art = "primaer", klein = false, className = "", ...rest }) {
  const basis = "inline-flex items-center justify-center gap-2 rounded-xl font-semibold " +
                "transition select-none disabled:opacity-40 disabled:cursor-not-allowed";
  const groesse = klein ? "px-4 py-2.5 text-sm min-h-11" : "px-5 py-3.5 text-base min-h-14";
  const arten = {
    primaer:  "bg-accent hover:bg-accent2 text-white",
    still:    "bg-panel2 border border-line2 text-text hover:border-accent",
    geist:    "bg-transparent border border-line2 text-muted hover:text-text hover:border-accent",
    gut:      "bg-ok hover:brightness-110 text-[#052e16]",
    warnung:  "bg-warn hover:brightness-110 text-[#431407]",
    gefahr:   "bg-bad hover:brightness-110 text-white"
  };
  return <button className={basis + " " + groesse + " " + arten[art] + " " + className} {...rest} />;
}

function Feld({ label, hinweis, children }) {
  return (
    <label className="block">
      <span className="block text-xs text-muted mb-1.5 font-medium">{label}</span>
      {children}
      {hinweis ? <span className="block text-xs text-muted mt-1">{hinweis}</span> : null}
    </label>
  );
}

const eingabeKlasse =
  "w-full bg-chip border border-line rounded-xl px-4 py-3 text-base text-text " +
  "outline-none focus:border-accent placeholder:text-muted/60";

/**
 * Datumsfeld, bei dem der Kalender schon beim Antippen aufgeht - statt
 * erst, wenn man das kleine Symbol am Rand trifft. Genau dafür gibt es
 * showPicker(); ältere Browser ignorieren den Aufruf, dort bleibt das
 * Symbol der Weg.
 */
function DatumFeld({ wert, onAendern, min, className = "" }) {
  const feld = useRef(null);

  function kalenderOeffnen() {
    const el = feld.current;
    if (!el || typeof el.showPicker !== "function") return;
    /* Wirft, wenn der Browser den Aufruf nicht als Nutzeraktion sieht -
       dann tut es einfach nichts, statt die App zu stoppen. */
    try { el.showPicker(); } catch (e) {}
  }

  return (
    <input ref={feld} type="date" value={wert} min={min || undefined}
           onChange={e => onAendern(e.target.value)}
           onClick={kalenderOeffnen}
           onFocus={kalenderOeffnen}
           className={eingabeKlasse + " cursor-pointer " + className} />
  );
}

function Lade({ text = "Lädt…" }) {
  return (
    <div className="flex items-center gap-3 text-muted py-10 justify-center">
      <span className="spin inline-block w-5 h-5 border-2 border-line2 border-t-accent rounded-full"></span>
      {text}
    </div>
  );
}

function Dialog({ titel, unterzeile, onSchliessen, children, breit = false }) {
  return (
    <div className="fixed inset-0 z-50 bg-black/70 flex items-end sm:items-center justify-center p-0 sm:p-6"
         onClick={onSchliessen}>
      <div className={"bg-panel border border-line rounded-t-2xl sm:rounded-2xl w-full " +
                      (breit ? "sm:max-w-3xl" : "sm:max-w-xl") +
                      " max-h-[92vh] overflow-y-auto shadow-2xl"}
           onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-panel border-b border-line px-6 py-4 flex items-start justify-between gap-4">
          <div>
            <h2 className="text-lg font-bold">{titel}</h2>
            {unterzeile ? <p className="text-sm text-muted mt-0.5">{unterzeile}</p> : null}
          </div>
          <button onClick={onSchliessen}
                  className="text-muted hover:text-text text-2xl leading-none px-2 -mr-2"
                  aria-label="Schließen">×</button>
        </div>
        <div className="px-6 py-5">{children}</div>
      </div>
    </div>
  );
}

/** Farbiges Etikett an einer Position: Nachbestellung / Geändert. */
function KennzeichnungBadge({ art, notiz }) {
  if (art === "original") return null;
  const stil = art === "neu"
    ? "bg-warn/15 text-warn border-warn/40"
    : "bg-bad/15 text-bad border-bad/40";
  const text = art === "neu" ? "NACHBESTELLUNG" : "GEÄNDERT";
  return (
    <span className={"inline-flex items-center gap-1.5 border rounded-lg px-2.5 py-1 text-xs font-bold tracking-wide " + stil}>
      {text}
      {notiz ? <span className="font-normal opacity-90">· {notiz}</span> : null}
    </span>
  );
}

/**
 * Schlägt anhand der Stichwortregeln einen Bereich für eine Position
 * vor. Findet nichts -> null, dann erbt die Position den Bereich des
 * Auftrags. Bewusst nur ein Vorschlag: korrigierbar bleibt alles.
 */
function bereichRaten(bezeichnung, regeln) {
  const text = (bezeichnung || "").toLowerCase();
  const treffer = regeln.find(r => r.aktiv !== false && text.includes(r.stichwort.toLowerCase()));
  return treffer ? treffer.bereich : null;
}

/** Farbiges Etikett mit dem Bereich einer Position. */
function BereichBadge({ schluessel, bereiche, klein = false }) {
  const b = bereiche.find(x => x.schluessel === schluessel);
  if (!b) return null;
  return (
    <span className={"inline-flex items-center gap-1.5 rounded-lg border font-semibold whitespace-nowrap " +
                     (klein ? "px-2 py-0.5 text-xs" : "px-2.5 py-1 text-xs")}
          style={{ color: b.farbe, borderColor: b.farbe + "66", background: b.farbe + "1a" }}>
      {b.name}
    </span>
  );
}

/** Wann das Fahrzeug da ist - und ob die Abholung schon durch ist. */
function TerminZeile({ a, gross = false }) {
  const text = zeitraumText(a.vor_ort_von, a.vor_ort_bis);

  let zusatz = null;
  if (a.termin_lage === "geplant" && a.tage_bis_anlieferung != null) {
    const t = a.tage_bis_anlieferung;
    zusatz = t === 1 ? "morgen" : "in " + t + " Tagen";
  } else if (a.termin_lage === "vor_ort") {
    zusatz = "vor Ort";
  } else if (a.termin_lage === "abholung_vorbei") {
    zusatz = "Abholung vorbei";
  }

  const farbe = a.ueberfaellig ? "text-bad"
              : a.termin_lage === "vor_ort" ? "text-warn"
              : "text-muted";

  return (
    <div className={"flex flex-wrap items-center gap-x-2 gap-y-1 " +
                    (gross ? "text-base" : "text-sm") + " " + farbe}>
      <span>📅</span>
      <span className="font-semibold">{text}</span>
      {zusatz ? <span className="opacity-80">· {zusatz}</span> : null}
    </div>
  );
}

function StatusPunkt({ status }) {
  const farbe = status === "neu" ? "bg-accent"
              : status === "in_arbeit" ? "bg-warn"
              : status === "abgeschlossen" ? "bg-ok"
              : "bg-muted";
  return <span className={"inline-block w-2.5 h-2.5 rounded-full " + farbe}></span>;
}

/** Rückfrage vor dem Löschen. Bewusst mit Klartext, was verschwindet. */
function LoeschDialog({ titel, text, onJa, onSchliessen }) {
  return (
    <Dialog titel={titel} onSchliessen={onSchliessen}>
      <p className="text-muted">{text}</p>
      <p className="text-muted text-sm mt-2">Das lässt sich nicht rückgängig machen.</p>
      <div className="flex gap-3 mt-6">
        <Knopf art="gefahr" onClick={onJa} className="flex-1">Endgültig löschen</Knopf>
        <Knopf art="geist" onClick={onSchliessen}>Abbrechen</Knopf>
      </div>
    </Dialog>
  );
}


/* =====================================================================
   Hauptanwendung
   ===================================================================== */

function Anwendung() {
  const [ansicht, setAnsicht] = useState({ name: "board" });
  const [mitarbeiter, setMitarbeiter] = useState([]);
  const [auftraege, setAuftraege] = useState([]);

  /* Stammdaten, die überall gebraucht werden. */
  const [bereiche, setBereiche] = useState([]);
  const [regeln, setRegeln] = useState([]);

  /* In welchem Bereich arbeitet das Tablet gerade. Wie beim Namen: bei
     jedem Öffnen neu gewählt, der letzte nur als Vorschlag gemerkt. */
  const [bereich, setBereich] = useState("");
  const [bereichWaehlen, setBereichWaehlen] = useState(false);
  const [letzterBereich, setLetzterBereich] = useState(() => {
    try { return localStorage.getItem("wsa_letzter_bereich") || STANDARD_BEREICH; }
    catch (e) { return STANDARD_BEREICH; }
  });
  const [laedt, setLaedt] = useState(true);
  const [startFehler, setStartFehler] = useState("");
  const [toast, setToast] = useState(null);

  /* Wer arbeitet gerade am Tablet. Wird bei jedem Öffnen neu abgefragt;
     gemerkt wird nur der letzte Name für die "Weiter als …"-Schaltfläche. */
  const [ichId, setIchId] = useState("");
  const [letzterName, setLetzterName] = useState(() => {
    try { return localStorage.getItem("wsa_letzter_name") || ""; } catch (e) { return ""; }
  });

  /* Admin-Modus: Aufträge ändern und löschen, Positionen bearbeiten.
     Gilt nur für diese Sitzung - beim nächsten Öffnen ist wieder der
     normale Werkstattbetrieb aktiv. So kann niemand versehentlich im
     Adminmodus stehen bleiben. */
  const [admin, setAdmin] = useState(false);
  const [adminDialog, setAdminDialog] = useState(false);
  /* Erzwingt die Namensauswahl, auch wenn schon ein Name gesetzt ist -
     für den Wechsel über die Kopfzeile. */
  const [nameWaehlen, setNameWaehlen] = useState(false);

  const melde = useCallback((text, art = "gut") => {
    setToast({ text, art });
    setTimeout(() => setToast(null), art === "bad" ? 6000 : 3000);
  }, []);

  const anmelden = useCallback((m) => {
    setIchId(m.id);
    setLetzterName(m.name);
    try { localStorage.setItem("wsa_letzter_name", m.name); } catch (e) {}
  }, []);

  /* Das Board des gewählten Bereichs. Chronologisch nach Anlieferung -
     der nächste Termin steht oben. Aufträge ohne Termin landen hinten,
     sie blockieren niemanden. */
  const ladeAuftraege = useCallback(async (fuerBereich) => {
    const b = fuerBereich || bereich;
    if (!b) return;
    const { data, error } = await db
      .from("v_board")
      .select("*")
      .eq("board_bereich", b)
      .order("vor_ort_von", { ascending: true, nullsFirst: false })
      .order("erstellt_am", { ascending: false });
    if (error) throw error;
    setAuftraege(data || []);
  }, [bereich]);

  /* Stammdaten einmal beim Start. Personen kommen aus v_personen, nicht
     aus der Tabelle - siehe docs/entscheidungen.md (E-08): Beim Umstieg
     aufs Hub wird nur diese eine View umgehängt. */
  const ladeAlles = useCallback(async () => {
    setLaedt(true);
    setStartFehler("");
    try {
      const [ma, br, rg] = await Promise.all([
        db.from("v_personen").select("*").eq("aktiv", true).order("name"),
        db.from("bereiche").select("*").eq("aktiv", true).order("sortierung"),
        db.from("bereich_regeln").select("*").eq("aktiv", true)
      ]);
      if (ma.error) throw ma.error;
      if (br.error) throw br.error;
      if (rg.error) throw rg.error;
      setMitarbeiter(ma.data || []);
      setBereiche(br.data || []);
      setRegeln(rg.data || []);
    } catch (e) {
      setStartFehler(e.message || String(e));
    } finally {
      setLaedt(false);
    }
  }, []);

  useEffect(() => { ladeAlles(); }, [ladeAlles]);

  /* Aufträge erst nachladen, wenn ein Bereich feststeht. */
  useEffect(() => {
    if (!bereich) return;
    ladeAuftraege(bereich).catch(e => setStartFehler(e.message || String(e)));
  }, [bereich, ladeAuftraege]);

  const aufDemBoard = useMemo(() => auftraege.filter(a => a.status !== "archiviert"), [auftraege]);
  const archivierte = useMemo(() => auftraege.filter(a => a.status === "archiviert"), [auftraege]);
  const ich = useMemo(() => mitarbeiter.find(m => m.id === ichId), [mitarbeiter, ichId]);
  const derBereich = useMemo(() => bereiche.find(b => b.schluessel === bereich), [bereiche, bereich]);

  const waehleBereich = useCallback((b) => {
    setBereich(b.schluessel);
    setLetzterBereich(b.schluessel);
    setBereichWaehlen(false);
    setAnsicht({ name: "board" });
    try { localStorage.setItem("wsa_letzter_bereich", b.schluessel); } catch (e) {}
  }, []);

  /* Vor der Namensauswahl gibt es nichts zu sehen - erst danach weiß die
     App, wem sie Buchungen zuschreiben soll. */
  if (laedt) return <Lade text="Wird geladen…" />;
  if (startFehler) {
    return (
      <main className="max-w-3xl mx-auto p-6">
        <StartFehler text={startFehler} onNochmal={ladeAlles} />
      </main>
    );
  }
  const toastBlock = toast ? (
    <div className={"fixed left-1/2 -translate-x-1/2 bottom-6 z-[60] px-5 py-3.5 rounded-xl " +
                    "border shadow-2xl text-base max-w-[92vw] " +
                    (toast.art === "bad"
                      ? "bg-[#2a1215] border-bad text-[#fecaca]"
                      : "bg-[#0b1220] border-line2 text-text")}>
      {toast.text}
    </div>
  ) : null;

  const adminBlock = adminDialog ? (
    <AdminAnmeldung
      onOk={() => {
        setAdmin(true);
        setAdminDialog(false);
        setNameWaehlen(false);
        /* Ohne bisherigen Namen unter der Admin-Kennung weiterarbeiten -
           dann steht bei Änderungen ein Name statt einer Lücke. Wer schon
           angemeldet ist, behält seinen eigenen: Er hat es ja getan. */
        if (!ichId) {
          const adminMa = mitarbeiter.find(m => m.name === ADMIN_NAME);
          if (adminMa) setIchId(adminMa.id);
        }
        melde("Admin-Modus aktiv.");
      }}
      onSchliessen={() => setAdminDialog(false)}
    />
  ) : null;

  const adminUmschalten = () => admin ? setAdmin(false) : setAdminDialog(true);

  /* Wer den Admin-Bereich freischaltet, kommt ohne Namen durch: Aufträge
     anlegen, ändern und löschen braucht keine Zuordnung. Buchen und
     Abhaken bleibt dafür gesperrt, bis ein Name gewählt ist - sonst
     stünden falsche Namen in der Historie. */
  if (nameWaehlen || (!ichId && !admin)) {
    return (
      <React.Fragment>
        <NamensAuswahl mitarbeiter={mitarbeiter} bereiche={bereiche} letzterName={letzterName}
                       onWahl={m => { anmelden(m); setNameWaehlen(false); }}
                       admin={admin} onAdmin={adminUmschalten} />
        {adminBlock}
        {toastBlock}
      </React.Fragment>
    );
  }

  /* Danach der Bereich. Ohne ihn wüsste das Board nicht, wessen
     Positionen es zählen soll. */
  if (bereichWaehlen || !bereich) {
    return (
      <React.Fragment>
        <BereichsAuswahl bereiche={bereiche} letzterBereich={letzterBereich}
                         ich={ich} onWahl={waehleBereich}
                         abbrechbar={!!bereich}
                         onAbbruch={() => setBereichWaehlen(false)} />
        {toastBlock}
      </React.Fragment>
    );
  }

  return (
    <div className="min-h-screen flex flex-col">
      <Kopfzeile
        ansicht={ansicht}
        setAnsicht={setAnsicht}
        ich={ich}
        onNameWechseln={() => setNameWaehlen(true)}
        derBereich={derBereich}
        onBereichWechseln={() => setBereichWaehlen(true)}
        anzahlOffen={aufDemBoard.length}
        anzahlArchiv={archivierte.length}
        admin={admin}
        onAdmin={adminUmschalten}
      />

      {admin ? (
        <div className="bg-bad/15 border-b border-bad/40 text-center py-2 text-sm font-semibold">
          🔓 Admin-Modus — Aufträge lassen sich jetzt ändern und löschen.
        </div>
      ) : null}

      <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 pb-24">
        {ansicht.name === "board" ? (
          <Board auftraege={aufDemBoard} derBereich={derBereich}
                 onOeffnen={id => setAnsicht({ name: "detail", id })}
                 onNeu={() => setAnsicht({ name: "neu" })} />
        ) : null}

        {ansicht.name === "archiv" ? (
          <Archiv auftraege={archivierte} onOeffnen={id => setAnsicht({ name: "detail", id })} />
        ) : null}

        {ansicht.name === "neu" ? (
          <NeuerAuftrag
            bereiche={bereiche} regeln={regeln} bereich={bereich}
            onFertig={async () => { await ladeAuftraege(); setAnsicht({ name: "board" }); melde("Auftrag angelegt."); }}
            onAbbruch={() => setAnsicht({ name: "board" })}
            melde={melde}
          />
        ) : null}

        {ansicht.name === "detail" ? (
          <Detail
            auftragId={ansicht.id}
            mitarbeiter={mitarbeiter}
            bereiche={bereiche}
            bereich={bereich}
            ichId={ichId}
            admin={admin}
            melde={melde}
            onZurueck={async () => { await ladeAuftraege(); setAnsicht({ name: "board" }); }}
            onGeaendert={ladeAuftraege}
          />
        ) : null}
      </main>

      {adminBlock}
      {toastBlock}
    </div>
  );
}


function StartFehler({ text, onNochmal }) {
  return (
    <div className="bg-bad/10 border border-bad/40 rounded-2xl p-6">
      <h2 className="font-bold text-lg text-[#fecaca]">Keine Verbindung zur Datenbank</h2>
      <p className="text-muted text-sm mt-2">
        Die Anwendung erreicht das Schema <code className="bg-chip px-1.5 py-0.5 rounded">werkstatt</code> nicht.
      </p>
      <pre className="bg-chip border border-line rounded-xl p-3 mt-3 text-xs whitespace-pre-wrap text-muted">{text}</pre>
      <ul className="text-sm text-muted mt-4 space-y-1.5 list-disc pl-5">
        <li>Wurde <b>Schweisserei-Supabase-Setup.sql</b> im Supabase SQL-Editor ausgeführt?</li>
        <li>Steht <b>werkstatt</b> unter <i>Project Settings → API → Exposed schemas</i>?</li>
        <li>Besteht eine Internetverbindung?</li>
      </ul>
      <Knopf art="still" className="mt-5" onClick={onNochmal}>Nochmal versuchen</Knopf>
    </div>
  );
}


/**
 * Namensauswahl nach dem PIN - wie in der Bestell-App.
 *
 * Erscheint bei jedem Öffnen neu. Das ist Absicht: Am gemeinsamen Tablet
 * würde ein gemerkter Name sonst dazu führen, dass alle auf denselben
 * Kollegen buchen. Für den Normalfall gibt es die Schaltfläche
 * "Weiter als …" - ein Tipp statt zwei.
 */
function NamensAuswahl({ mitarbeiter, bereiche, letzterName, onWahl, admin, onAdmin }) {
  /* Alle, die in einem Werkstattbereich stehen. Wer 'buero' ist - Simon
     und die Kollegen aus der Lieferschein-Maske - gehört nicht auf die
     Kacheln am Werkstatt-Tablet. Kommt jemand für die Elektrik dazu,
     genügt bereich = 'elektrik' und er erscheint hier. */
  const werkstattBereiche = bereiche.map(b => b.schluessel);
  const auswahl = mitarbeiter.filter(m => werkstattBereiche.includes(m.bereich));
  const letzter = auswahl.find(m => m.name === letzterName);

  return (
    <div className="min-h-screen flex items-center justify-center p-6 relative">
      {/* Admin-Zugang schon hier, damit man dafür nicht erst einen
          Namen wählen muss. */}
      <button onClick={onAdmin}
              title={admin ? "Admin-Modus beenden" : "Admin-Bereich freischalten"}
              className={"absolute top-5 right-5 px-4 py-2.5 rounded-xl text-sm min-h-11 border transition " +
                (admin ? "bg-bad/20 border-bad text-bad font-semibold"
                       : "bg-panel border-line text-muted hover:text-text")}>
        {admin ? "🔓 Admin" : "🔒 Admin"}
      </button>

      <div className="w-full max-w-2xl text-center">
        <div className="text-4xl mb-3">🔧</div>
        <h1 className="text-2xl font-bold">Wer bist du?</h1>
        <p className="text-muted mt-2 mb-8">
          Wähle deinen Namen — gebuchte Zeiten und erledigte Positionen werden dir zugeordnet.
        </p>

        {letzter ? (
          <button onClick={() => onWahl(letzter)}
                  className="w-full mb-6 bg-panel border border-line2 rounded-2xl px-6 py-4
                             text-left hover:border-accent transition">
            <span className="text-muted text-sm">Zuletzt hier</span>
            <span className="block text-lg font-semibold">↩ Weiter als {letzter.name}</span>
          </button>
        ) : null}

        <div className="grid gap-4 sm:grid-cols-3">
          {auswahl.map(m => (
            <button key={m.id} onClick={() => onWahl(m)}
                    className="bg-panel border border-line rounded-2xl px-6 py-8 text-xl font-bold
                               hover:border-accent hover:bg-panel2 transition active:scale-[0.98]">
              {m.name}
            </button>
          ))}
        </div>

        {auswahl.length === 0 ? (
          <p className="text-muted mt-6">
            Es sind noch keine Mitarbeiter hinterlegt.
          </p>
        ) : null}
      </div>
    </div>
  );
}


/**
 * Bereichsauswahl nach dem Namen. Bestimmt, wessen Positionen das Board
 * zählt - und damit, was der Kollege als seine Arbeit angezeigt bekommt.
 */
function BereichsAuswahl({ bereiche, letzterBereich, ich, onWahl, abbrechbar, onAbbruch }) {
  const letzter = bereiche.find(b => b.schluessel === letzterBereich);

  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="w-full max-w-3xl text-center">
        <div className="text-4xl mb-3">🏭</div>
        <h1 className="text-2xl font-bold">
          {ich ? ich.name + ", welcher Bereich?" : "Welcher Bereich?"}
        </h1>
        <p className="text-muted mt-2 mb-8">
          Das Board zeigt danach alle Aufträge, in denen für diesen Bereich etwas zu tun ist.
        </p>

        {letzter ? (
          <button onClick={() => onWahl(letzter)}
                  className="w-full mb-6 bg-panel border border-line2 rounded-2xl px-6 py-4
                             text-left hover:border-accent transition">
            <span className="text-muted text-sm">Zuletzt hier</span>
            <span className="block text-lg font-semibold">↩ Weiter in {letzter.name}</span>
          </button>
        ) : null}

        <div className="grid gap-4 sm:grid-cols-3">
          {bereiche.map(b => (
            <button key={b.schluessel} onClick={() => onWahl(b)}
                    className="bg-panel border rounded-2xl px-5 py-7 text-lg font-bold
                               hover:bg-panel2 transition active:scale-[0.98]"
                    style={{ borderColor: b.farbe + "66", color: b.farbe }}>
              {b.name}
            </button>
          ))}
        </div>

        {bereiche.length === 0 ? (
          <p className="text-muted mt-6">Es sind keine Bereiche hinterlegt.</p>
        ) : null}

        {abbrechbar ? (
          <Knopf art="geist" className="mt-8" onClick={onAbbruch}>Abbrechen</Knopf>
        ) : null}
      </div>
    </div>
  );
}


function AdminAnmeldung({ onOk, onSchliessen }) {
  const [wert, setWert] = useState("");
  const [fehler, setFehler] = useState("");

  function pruefen(e) {
    e.preventDefault();
    if (wert.trim() === ADMIN_PIN) onOk();
    else { setFehler("Falscher Admin-PIN."); setWert(""); }
  }

  return (
    <Dialog titel="Admin-Bereich" unterzeile="Aufträge ändern und löschen" onSchliessen={onSchliessen}>
      <form onSubmit={pruefen}>
        <p className="text-muted text-sm mb-4">
          Im normalen Betrieb lassen sich Aufträge anlegen, Zeiten buchen und Positionen
          abhaken. Zum <b>Ändern und Löschen</b> von Aufträgen und Positionen ist der
          Admin-PIN nötig.
        </p>
        <input type="password" inputMode="numeric" autoFocus value={wert}
               onChange={e => { setWert(e.target.value); setFehler(""); }}
               className={eingabeKlasse + " text-center text-2xl tracking-[0.4em]"}
               placeholder="Admin-PIN" />
        <div className="text-bad text-sm h-5 mt-2">{fehler}</div>
        <div className="flex gap-3 mt-3">
          <Knopf type="submit" className="flex-1">Freischalten</Knopf>
          <Knopf art="geist" type="button" onClick={onSchliessen}>Abbrechen</Knopf>
        </div>
        <p className="text-muted text-xs mt-4">
          Gilt nur für diese Sitzung — nach dem Schließen des Browsers wieder normaler Betrieb.
        </p>
      </form>
    </Dialog>
  );
}


function Kopfzeile({ ansicht, setAnsicht, ich, onNameWechseln, derBereich, onBereichWechseln,
                     anzahlOffen, anzahlArchiv, admin, onAdmin }) {
  const reiter = [
    { id: "board",  text: "Aufträge", zahl: anzahlOffen },
    { id: "archiv", text: "Archiv",   zahl: anzahlArchiv }
  ];
  return (
    <header className="sticky top-0 z-30 bg-chip border-b border-line">
      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center gap-x-5 gap-y-3">
        <div className="flex items-center gap-3 mr-auto">
          <span className="bg-accent text-white rounded-lg px-2.5 py-1 text-xs font-bold tracking-wider">WSA</span>
          <button onClick={onBereichWechseln} title="Bereich wechseln"
                  className="leading-tight text-left rounded-lg px-2 py-1 -mx-2 hover:bg-panel transition">
            <div className="font-bold">Auftragsübersicht</div>
            <div className="text-xs font-semibold flex items-center gap-1.5"
                 style={{ color: derBereich ? derBereich.farbe : undefined }}>
              {derBereich ? derBereich.name : "—"}
              <span className="text-muted font-normal">↩</span>
            </div>
          </button>
        </div>

        <nav className="flex gap-2">
          {reiter.map(r => (
            <button key={r.id}
                    onClick={() => setAnsicht({ name: r.id })}
                    className={"px-4 py-2.5 rounded-xl text-sm font-semibold min-h-11 transition " +
                      (ansicht.name === r.id || (r.id === "board" && ansicht.name === "detail")
                        ? "bg-accent text-white"
                        : "bg-panel border border-line text-muted hover:text-text")}>
              {r.text}
              <span className="ml-2 opacity-70">{r.zahl}</span>
            </button>
          ))}
        </nav>

        <div className="flex items-center gap-2">
          <button onClick={onNameWechseln}
                  title="Namen wechseln"
                  className="flex items-center gap-2 bg-panel border border-line rounded-xl
                             px-4 py-2.5 min-h-11 hover:border-accent transition">
            <span className="text-muted text-xs hidden sm:inline">
              {ich ? "angemeldet" : ""}
            </span>
            <span className={"font-semibold text-sm " + (ich ? "" : "text-warn")}>
              {ich ? ich.name : "Name wählen"}
            </span>
            <span className="text-muted text-xs">↩</span>
          </button>

          <button onClick={onAdmin}
                  title={admin ? "Admin-Modus beenden" : "Admin-Bereich freischalten"}
                  className={"px-3 py-2.5 rounded-xl text-sm min-h-11 border transition " +
                    (admin ? "bg-bad/20 border-bad text-bad font-semibold"
                           : "bg-panel border-line text-muted hover:text-text")}>
            {admin ? "🔓 Admin" : "🔒"}
          </button>
        </div>
      </div>
    </header>
  );
}


/* ---------- Board ---------------------------------------------------- */

/**
 * Eine Spalte des Boards. Nichts wird mehr von Hand einsortiert - die
 * Reihenfolge ist chronologisch nach Anlieferung, und in welcher Spalte
 * eine Karte steht, leitet die Datenbank aus Termin und abgehakten
 * Positionen ab.
 */
function BoardSpalte({ spalte, liste, onOeffnen }) {
  return (
    <section className={"rounded-2xl border p-4 " + spalte.rahmen}>
      <h2 className="flex items-center gap-2.5 text-sm font-bold tracking-wider uppercase mb-4">
        <StatusPunkt status={spalte.status} />
        <span className={spalte.schrift}>{spalte.titel}</span>
        <span className="text-muted ml-auto">{liste.length}</span>
      </h2>

      {liste.length === 0 ? (
        <p className="text-muted text-sm text-center py-6">{spalte.leer}</p>
      ) : (
        <div className="grid gap-3">
          {liste.map(a => <Kachel key={a.id} a={a} onClick={() => onOeffnen(a.id)} />)}
        </div>
      )}
    </section>
  );
}


function Board({ auftraege, derBereich, onOeffnen, onNeu }) {
  const ueberfaellige = auftraege.filter(a => a.ueberfaellig).length;

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div>
          <h1 className="text-2xl font-bold">Aufträge</h1>
          {derBereich ? (
            <p className="text-muted text-sm mt-0.5">
              Alles, wo für <span style={{ color: derBereich.farbe }}>{derBereich.name}</span> etwas zu tun ist
            </p>
          ) : null}
        </div>
        <Knopf onClick={onNeu}>+ Neuer Auftrag</Knopf>
      </div>

      {ueberfaellige > 0 ? (
        <div className="bg-bad/15 border border-bad/50 rounded-2xl px-5 py-4 mb-5">
          <b className="text-bad">
            {ueberfaellige === 1 ? "Ein Auftrag ist überfällig" : ueberfaellige + " Aufträge sind überfällig"}
          </b>
          <span className="text-muted"> — Abholtermin vorbei, aber hier noch nicht alles erledigt.</span>
        </div>
      ) : null}

      {auftraege.length === 0 ? (
        <div className="bg-panel border border-line border-dashed rounded-2xl p-12 text-center">
          <div className="text-4xl mb-3">📋</div>
          <p className="text-muted">
            Für diesen Bereich ist gerade nichts zu tun.
          </p>
          <p className="text-muted text-sm mt-1">
            Aufträge erscheinen hier, sobald sie mindestens eine Fertigungsposition
            für den Bereich enthalten.
          </p>
          <Knopf art="still" className="mt-5" onClick={onNeu}>Auftrag anlegen</Knopf>
        </div>
      ) : (
        /* Drei Spalten nebeneinander im Landscape des Tablets, darunter
           gestapelt - sonst würden die Kacheln zu schmal zum Antippen. */
        <div className="grid gap-5 lg:grid-cols-3 items-start">
          {SPALTEN.map(s => (
            <BoardSpalte key={s.status} spalte={s}
                         liste={auftraege.filter(a => a.bereich_status === s.status)}
                         onOeffnen={onOeffnen} />
          ))}
        </div>
      )}
    </div>
  );
}

function Kachel({ a, onClick }) {
  /* Nur die Positionen DIESES Bereichs. Dass hier nicht "3 von 27"
     steht, ist der Punkt: Sonst geht die eine Schweißarbeit im
     Werkstattauftrag unter. */
  const gesamt   = a.bereich_fertigung || 0;
  const erledigt = a.bereich_fertigung_erledigt || 0;
  const anteil   = gesamt > 0 ? Math.round((erledigt / gesamt) * 100) : 0;
  const fertig   = gesamt > 0 && erledigt === gesamt;

  return (
    <div data-id={a.id}
         onClick={onClick} role="button" tabIndex={0}
         onKeyDown={e => { if (e.key === "Enter" || e.key === " ") onClick(); }}
         className={"karte rounded-2xl border p-5 cursor-pointer transition text-left " +
           (a.ueberfaellig
             ? "bg-bad/10 border-bad hover:bg-bad/15"
             : "bg-panel border-line hover:border-accent hover:bg-panel2")}>

      {a.ueberfaellig ? (
        <div className="text-bad text-xs font-bold tracking-wider uppercase mb-2">
          ⚠ Überfällig
        </div>
      ) : null}

      <div className="flex items-start justify-between gap-3">
        <div className="min-w-0">
          <div className="font-bold text-lg truncate">{a.beleg_nr || "ohne Beleg-Nr."}</div>
          <div className="text-muted text-sm truncate">{a.kunde || "—"}</div>
        </div>
        <div className="flex items-center gap-1.5 shrink-0 text-muted">
          {a.anzahl_kommentare > 0 ? (
            <span className="text-sm" title={a.anzahl_kommentare + " Kommentare"}>
              💬{a.anzahl_kommentare}
            </span>
          ) : null}
          {a.dokument_pfad ? <span className="text-lg" title="PDF hinterlegt">📄</span> : null}
        </div>
      </div>

      {a.fahrzeug ? <div className="text-muted text-sm mt-1.5 truncate">🚐 {a.fahrzeug}</div> : null}

      <div className="mt-3">
        <TerminZeile a={a} />
      </div>

      <div className="mt-4">
        <div className="flex items-center justify-between text-sm mb-1.5">
          <span className={fertig ? "text-ok font-semibold" : "text-muted"}>
            {erledigt}/{gesamt} {gesamt === 1 ? "Position" : "Positionen"} für dich
          </span>
          <span className="text-muted">{minutenText(a.bereich_minuten)}</span>
        </div>
        <div className="h-2 bg-chip rounded-full overflow-hidden">
          <div className={"h-full rounded-full transition-all " +
                          (fertig ? "bg-ok" : a.ueberfaellig ? "bg-bad" : "bg-accent")}
               style={{ width: anteil + "%" }}></div>
        </div>
      </div>

      {/* Wenn der Auftrag mehr umfasst, als diesen Bereich betrifft:
          sagen, wie viel - sonst wirkt die Detailansicht später
          unerwartet voll. */}
      {a.anzahl_fertigung > gesamt ? (
        <div className="mt-2.5 text-xs text-muted">
          Auftrag umfasst {a.anzahl_fertigung} Positionen insgesamt
        </div>
      ) : null}
    </div>
  );
}


/* ---------- Archiv --------------------------------------------------- */

function Archiv({ auftraege, onOeffnen }) {
  const [suche, setSuche] = useState("");

  const gefiltert = useMemo(() => {
    const s = suche.trim().toLowerCase();
    if (!s) return auftraege;
    return auftraege.filter(a =>
      (a.beleg_nr || "").toLowerCase().includes(s) ||
      (a.kunde || "").toLowerCase().includes(s) ||
      (a.fahrzeug || "").toLowerCase().includes(s)
    );
  }, [auftraege, suche]);

  return (
    <div>
      <h1 className="text-2xl font-bold mb-5">Archiv</h1>
      <input value={suche} onChange={e => setSuche(e.target.value)}
             className={eingabeKlasse + " mb-5"}
             placeholder="Suchen nach Beleg-Nr., Kunde oder Fahrzeug…" />

      {gefiltert.length === 0 ? (
        <div className="bg-panel border border-line border-dashed rounded-2xl p-12 text-center text-muted">
          {suche ? "Nichts gefunden." : "Noch kein Auftrag abgeschlossen."}
        </div>
      ) : (
        <div className="grid gap-3">
          {gefiltert.map(a => (
            <button key={a.id} onClick={() => onOeffnen(a.id)}
                    className="text-left bg-panel border border-line rounded-xl px-5 py-4 w-full
                               hover:border-accent transition flex flex-wrap items-center gap-x-5 gap-y-1.5">
              <span className="font-bold">{a.beleg_nr || "ohne Beleg-Nr."}</span>
              <span className="text-muted">{a.kunde || "—"}</span>
              <span className="text-muted text-sm ml-auto">{minutenText(a.gebuchte_minuten)}</span>
              <span className="text-muted text-sm">abgeschlossen {datumText(a.abgeschlossen_am)}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}


/* ---------- Neuer Auftrag -------------------------------------------- */

function NeuerAuftrag({ bereiche, regeln, bereich, onFertig, onAbbruch, melde }) {
  const [kopf, setKopf] = useState({
    beleg_nr: "", kunde: "", fahrzeug: "", notiz: "",
    vor_ort_von: "", vor_ort_bis: ""
  });
  const [zeilen, setZeilen] = useState([leereZeile()]);
  const [datei, setDatei] = useState(null);
  const [einfuegen, setEinfuegen] = useState("");
  const [zeigeEinfuegen, setZeigeEinfuegen] = useState(false);
  const [speichert, setSpeichert] = useState(false);
  const dateiRef = useRef(null);

  const [apiKey, setApiKey] = useState(() => {
    try { return localStorage.getItem(KEY_SPEICHER) || ""; } catch (e) { return ""; }
  });
  const [zeigeKey, setZeigeKey] = useState(false);
  const [liest, setLiest] = useState("");   // Statustext während des Auslesens

  function merkeKey(wert) {
    setApiKey(wert);
    try { localStorage.setItem(KEY_SPEICHER, wert.trim()); } catch (e) {}
  }

  /** PDF an Claude schicken und die erkannten Zeilen übernehmen. */
  async function pdfAuslesen() {
    if (!datei) return;
    if (!apiKey.trim()) { setZeigeKey(true); melde("Bitte einmalig den Claude-API-Key eintragen.", "bad"); return; }

    setLiest("Beleg wird gelesen…");
    try {
      const erg = await leseBelegAus(apiKey.trim(), datei, (v, max) =>
        setLiest("Claude ist ausgelastet — Versuch " + v + " von " + max + "…"));

      /* Kopfdaten nur füllen, wenn noch nichts eingetragen ist -
         was von Hand kam, hat Vorrang vor der Erkennung. */
      setKopf(alt => ({
        ...alt,
        beleg_nr: alt.beleg_nr.trim() || (erg.beleg_nr || ""),
        kunde:    alt.kunde.trim()    || (erg.kunde || ""),
        fahrzeug: alt.fahrzeug.trim() || (erg.fahrzeug || "")
      }));

      const neue = (erg.positionen || []).map(p => ({
        bezeichnung:   (p.bezeichnung || "").trim(),
        menge:         String(p.menge || "1").replace(",", "."),
        einheit:       (p.einheit || "Stk").trim() || "Stk",
        ist_fertigung: p.art !== "zukauf",
        /* Bereich aus den Stichwortregeln vorschlagen. Kein Treffer ->
           leer, dann erbt die Position den Bereich des Auftrags. */
        bereich:       bereichRaten(p.bezeichnung, regeln) || ""
      })).filter(p => p.bezeichnung);

      if (neue.length === 0) {
        melde("Es wurden keine Positionen erkannt. Bitte von Hand erfassen.", "bad");
      } else {
        setZeilen(alt => alt.filter(z => z.bezeichnung.trim()).concat(neue));
        const zk = neue.filter(p => !p.ist_fertigung).length;
        const zug = neue.filter(p => p.bereich).length;
        melde(neue.length + " Positionen erkannt" +
              (zk ? ", " + zk + " als Zukaufteil" : "") +
              (zug ? ", " + zug + " einem anderen Bereich zugeordnet" : "") +
              " — bitte prüfen.");
      }
    } catch (e) {
      melde("Auslesen fehlgeschlagen: " + (e.message || e), "bad");
    } finally {
      setLiest("");
    }
  }

  function leereZeile() {
    return { bezeichnung: "", menge: "1", einheit: "Stk", ist_fertigung: true, bereich: "" };
  }

  function aendere(i, feld, wert) {
    setZeilen(alt => alt.map((z, k) => k === i ? { ...z, [feld]: wert } : z));
  }

  function uebernehmeBlock() {
    const roh = zerlegeBlock(einfuegen);
    if (roh.length === 0) { melde("Keine Zeilen erkannt.", "bad"); return; }
    const neue = roh.map(z => ({ ...z, bereich: bereichRaten(z.bezeichnung, regeln) || "" }));
    setZeilen(alt => {
      const bestand = alt.filter(z => z.bezeichnung.trim());
      return bestand.concat(neue);
    });
    setEinfuegen("");
    setZeigeEinfuegen(false);
    melde(neue.length + " Zeilen übernommen — bitte prüfen.");
  }

  async function speichern() {
    const gueltige = zeilen.filter(z => z.bezeichnung.trim());
    if (!kopf.beleg_nr.trim() && !kopf.kunde.trim()) {
      melde("Bitte mindestens Beleg-Nr. oder Kunde angeben.", "bad");
      return;
    }
    if (gueltige.length === 0) {
      melde("Bitte mindestens eine Position erfassen.", "bad");
      return;
    }

    setSpeichert(true);
    try {
      const { data: auftrag, error: aFehler } = await db
        .from("auftraege")
        .insert({
          beleg_nr: kopf.beleg_nr.trim() || null,
          kunde:    kopf.kunde.trim() || null,
          fahrzeug: kopf.fahrzeug.trim() || null,
          notiz:    kopf.notiz.trim() || null,
          vor_ort_von: kopf.vor_ort_von || null,
          vor_ort_bis: kopf.vor_ort_bis || null,
          /* Der führende Bereich des Auftrags - er gilt für alle
             Positionen, die keinen eigenen tragen. */
          bereich:  bereich,
          status:   "neu"
        })
        .select()
        .single();
      if (aFehler) throw aFehler;

      const { error: pFehler } = await db.from("positionen").insert(
        gueltige.map((z, i) => ({
          auftrag_id:    auftrag.id,
          pos_nr:        i + 1,
          bezeichnung:   z.bezeichnung.trim(),
          menge:         z.menge ? Number(String(z.menge).replace(",", ".")) : null,
          einheit:       z.einheit.trim() || null,
          ist_fertigung: z.ist_fertigung,
          /* Leer heißt: erbt den Bereich des Auftrags. */
          bereich:       z.bereich || null,
          kennzeichnung: "original"
        }))
      );
      if (pFehler) throw pFehler;

      /* PDF zum Schluss: Wenn der Upload scheitert, steht der Auftrag
         trotzdem schon im Board und das PDF lässt sich nachreichen. */
      if (datei) {
        const pfad = auftrag.id + "/" + Date.now() + "_" + dateiNameSauber(datei.name);
        const { error: sFehler } = await db.storage.from(BUCKET).upload(pfad, datei, {
          contentType: "application/pdf", upsert: false
        });
        if (sFehler) {
          melde("Auftrag gespeichert, aber das PDF konnte nicht hochgeladen werden: " + sFehler.message, "bad");
        } else {
          await db.from("auftraege").update({ dokument_pfad: pfad }).eq("id", auftrag.id);
        }
      }

      await onFertig();
    } catch (e) {
      melde("Speichern fehlgeschlagen: " + (e.message || e), "bad");
      setSpeichert(false);
    }
  }

  return (
    <div>
      <div className="flex items-center gap-4 mb-6">
        <Knopf art="geist" klein onClick={onAbbruch}>← Zurück</Knopf>
        <h1 className="text-2xl font-bold">Neuer Auftrag</h1>
      </div>

      <div className="bg-panel border border-line rounded-2xl p-6 mb-5">
        <h2 className="font-bold mb-4">Kopfdaten</h2>
        <div className="grid gap-4 sm:grid-cols-2">
          <Feld label="Beleg-Nr. (WSA)">
            <input className={eingabeKlasse} value={kopf.beleg_nr} placeholder="z. B. WSA-1042"
                   onChange={e => setKopf({ ...kopf, beleg_nr: e.target.value })} />
          </Feld>
          <Feld label="Kunde">
            <input className={eingabeKlasse} value={kopf.kunde}
                   onChange={e => setKopf({ ...kopf, kunde: e.target.value })} />
          </Feld>
          <Feld label="Fahrzeug (optional)" hinweis="z. B. Sprinter L2H2 oder Kennzeichen">
            <input className={eingabeKlasse} value={kopf.fahrzeug}
                   onChange={e => setKopf({ ...kopf, fahrzeug: e.target.value })} />
          </Feld>
          <Feld label="Notiz (optional)">
            <input className={eingabeKlasse} value={kopf.notiz}
                   onChange={e => setKopf({ ...kopf, notiz: e.target.value })} />
          </Feld>
        </div>

        {/* Der Termin bestimmt, wann der Auftrag von der Warteschlange
            in die Arbeit rutscht - deshalb steht er hier und nicht unten. */}
        <div className="bg-chip border border-line rounded-xl p-4 mt-5">
          <div className="flex items-center gap-2 mb-3">
            <span>📅</span>
            <span className="font-semibold text-sm">Fahrzeug ist vor Ort</span>
          </div>
          <div className="grid gap-4 sm:grid-cols-2">
            <Feld label="Anlieferung" hinweis="Ab diesem Tag steht der Auftrag in „In Arbeit“.">
              <DatumFeld wert={kopf.vor_ort_von}
                         onAendern={v => setKopf({ ...kopf, vor_ort_von: v })} />
            </Feld>
            <Feld label="Abholung" hinweis="Danach wird der Auftrag rot, wenn noch etwas offen ist.">
              {/* Vor der Anlieferung gibt es nichts abzuholen - der
                  Kalender sperrt diese Tage gleich. */}
              <DatumFeld wert={kopf.vor_ort_bis} min={kopf.vor_ort_von}
                         onAendern={v => setKopf({ ...kopf, vor_ort_bis: v })} />
            </Feld>
          </div>
          {kopf.vor_ort_von && kopf.vor_ort_bis && kopf.vor_ort_bis < kopf.vor_ort_von ? (
            <p className="text-bad text-sm mt-2">Die Abholung liegt vor der Anlieferung.</p>
          ) : null}
        </div>

        <div className="mt-5">
          <Feld label="Original-PDF"
                hinweis="Der WSA-Beleg aus Lexware. Wird am Auftrag hinterlegt — und kann die Positionen automatisch füllen.">
            {datei ? (
              <div className="bg-ok/10 border border-ok/40 rounded-xl px-4 py-3.5">
                <div className="flex flex-wrap items-center gap-3">
                  <span className="text-xl">📄</span>
                  <div className="min-w-0 mr-auto">
                    <div className="font-semibold truncate">{datei.name}</div>
                    <div className="text-muted text-xs">
                      {(datei.size / 1024 / 1024).toFixed(1)} MB · wird beim Anlegen hochgeladen
                    </div>
                  </div>
                  <button onClick={() => { setDatei(null); if (dateiRef.current) dateiRef.current.value = ""; }}
                          className="text-muted hover:text-bad text-sm underline px-2 min-h-11">
                    entfernen
                  </button>
                </div>

                <div className="flex flex-wrap items-center gap-3 mt-3 pt-3 border-t border-ok/25">
                  <Knopf klein onClick={pdfAuslesen} disabled={!!liest}>
                    {liest ? "⏳ " + liest : "✨ Positionen aus PDF auslesen"}
                  </Knopf>
                  {!liest ? (
                    <span className="text-muted text-xs">
                      Claude liest den Beleg und füllt die Positionen unten. Ergebnis bitte prüfen.
                    </span>
                  ) : null}
                </div>
              </div>
            ) : (
              <input ref={dateiRef} type="file" accept="application/pdf"
                     onChange={e => setDatei(e.target.files[0] || null)}
                     className="block w-full text-sm text-muted file:mr-4 file:py-3 file:px-5
                                file:rounded-xl file:border-0 file:bg-panel2 file:text-text
                                file:font-semibold file:cursor-pointer hover:file:bg-line" />
            )}
          </Feld>

          {/* API-Key fürs Auslesen. Einmal eintragen, bleibt im Browser
              dieses Geräts gespeichert - derselbe Ablauf wie im
              Wareneingang des Artikelmanagers. */}
          <div className="mt-3">
            {apiKey && !zeigeKey ? (
              <button onClick={() => setZeigeKey(true)}
                      className="text-muted text-xs underline hover:text-text">
                Claude-API-Key hinterlegt · ändern
              </button>
            ) : (
              <div className="bg-chip border border-line rounded-xl p-4">
                <Feld label="Claude-API-Key"
                      hinweis="Nur nötig fürs Auslesen. Wird im Browser dieses Geräts gespeichert.">
                  <input type="password" value={apiKey} placeholder="sk-ant-…"
                         autoComplete="off" onChange={e => merkeKey(e.target.value)}
                         className={eingabeKlasse} />
                </Feld>
                {apiKey ? (
                  <Knopf art="geist" klein className="mt-3" onClick={() => setZeigeKey(false)}>Fertig</Knopf>
                ) : null}
              </div>
            )}
          </div>
        </div>
      </div>

      <div className="bg-panel border border-line rounded-2xl p-6 mb-5">
        <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
          <h2 className="font-bold">Positionen</h2>
          <Knopf art="geist" klein onClick={() => setZeigeEinfuegen(v => !v)}>
            📋 Aus Beleg einfügen
          </Knopf>
        </div>

        {zeigeEinfuegen ? (
          <div className="bg-chip border border-line rounded-xl p-4 mb-5">
            <p className="text-sm text-muted mb-2">
              Positionsblock aus dem Beleg hier einfügen — eine Position je Zeile.
              Die Zeilen werden danach ganz normal editierbar.
            </p>
            <textarea rows="6" value={einfuegen} onChange={e => setEinfuegen(e.target.value)}
                      className={eingabeKlasse + " font-mono text-sm"}
                      placeholder={"2 Stk Konsole 40x40 verzinkt\n1 Stk Trittstufe links\n4 Stk Halter M8"} />
            <div className="flex gap-3 mt-3">
              <Knopf klein onClick={uebernehmeBlock} disabled={!einfuegen.trim()}>Übernehmen</Knopf>
              <Knopf art="geist" klein onClick={() => setZeigeEinfuegen(false)}>Abbrechen</Knopf>
            </div>
          </div>
        ) : null}

        <div className="space-y-3">
          {zeilen.map((z, i) => (
            <div key={i} className="bg-chip border border-line rounded-xl p-4">
              <div className="flex items-start gap-3">
                <span className="text-muted font-mono text-sm pt-3.5 w-6 shrink-0">{i + 1}</span>
                <div className="flex-1 grid gap-3 sm:grid-cols-[1fr_5rem_6rem]">
                  <input className={eingabeKlasse} placeholder="Bezeichnung" value={z.bezeichnung}
                         onChange={e => aendere(i, "bezeichnung", e.target.value)} />
                  <input className={eingabeKlasse} placeholder="Menge" inputMode="decimal" value={z.menge}
                         onChange={e => aendere(i, "menge", e.target.value)} />
                  <input className={eingabeKlasse} placeholder="Einheit" value={z.einheit}
                         onChange={e => aendere(i, "einheit", e.target.value)} />
                </div>
                <button onClick={() => setZeilen(alt => alt.filter((_, k) => k !== i))}
                        className="text-muted hover:text-bad text-xl px-2 pt-2.5 shrink-0"
                        aria-label="Zeile entfernen">×</button>
              </div>

              <div className="flex gap-2 mt-3 ml-9">
                <button onClick={() => aendere(i, "ist_fertigung", true)}
                        className={"px-4 py-2 rounded-lg text-sm font-semibold min-h-10 border transition " +
                          (z.ist_fertigung
                            ? "bg-accent/15 border-accent text-accent"
                            : "bg-transparent border-line2 text-muted")}>
                  🔧 Fertigung
                </button>
                <button onClick={() => aendere(i, "ist_fertigung", false)}
                        className={"px-4 py-2 rounded-lg text-sm font-semibold min-h-10 border transition " +
                          (!z.ist_fertigung
                            ? "bg-muted/15 border-muted text-muted"
                            : "bg-transparent border-line2 text-muted")}>
                  📦 Zukaufteil
                </button>
                {!z.ist_fertigung ? (
                  <span className="text-xs text-muted self-center ml-1">keine Stundenerfassung</span>
                ) : null}

                {/* Leer = macht der eigene Bereich. Nur die Ausnahme wird
                    umgestellt - der Dachträger im Werkstattauftrag. */}
                <select value={z.bereich} onChange={e => aendere(i, "bereich", e.target.value)}
                        className="ml-auto bg-chip border border-line rounded-lg px-3 py-2 text-sm
                                   min-h-10 outline-none focus:border-accent"
                        style={z.bereich ? {
                          color: (bereiche.find(b => b.schluessel === z.bereich) || {}).farbe,
                          borderColor: ((bereiche.find(b => b.schluessel === z.bereich) || {}).farbe || "") + "66"
                        } : undefined}>
                  <option value="">macht der eigene Bereich</option>
                  {bereiche.map(b => (
                    <option key={b.schluessel} value={b.schluessel}>{b.name}</option>
                  ))}
                </select>
              </div>
            </div>
          ))}
        </div>

        <Knopf art="still" className="mt-4"
               onClick={() => setZeilen(alt => alt.concat([leereZeile()]))}>
          + Zeile
        </Knopf>
      </div>

      {/* Sagt vorab, was noch fehlt - statt den Fehler erst beim Drücken zu melden. */}
      {(() => {
        const fehlt = [];
        if (!kopf.beleg_nr.trim() && !kopf.kunde.trim()) fehlt.push("Beleg-Nr. oder Kunde");
        if (zeilen.filter(z => z.bezeichnung.trim()).length === 0) fehlt.push("mindestens eine Position");
        return fehlt.length > 0
          ? <p className="text-warn text-sm mb-3">Zum Anlegen fehlt noch: {fehlt.join(" und ")}.</p>
          : null;
      })()}

      <div className="flex flex-wrap gap-3">
        <Knopf onClick={speichern} disabled={speichert}>
          {speichert ? (datei ? "Speichert und lädt PDF hoch…" : "Speichert…") : "Auftrag anlegen"}
        </Knopf>
        <Knopf art="geist" onClick={onAbbruch} disabled={speichert}>Abbrechen</Knopf>
      </div>
    </div>
  );
}


/* ---------- Kommentare und Skizzen ------------------------------------ */

/**
 * Laufende Kommentarspalte rechts neben dem Auftrag. Immer sichtbar,
 * nichts zum Aufklappen - im Werkstattalltag sind die Absprachen so
 * wichtig wie die Positionsliste selbst.
 *
 * Bilder werden hier nur als Vorschaubild gezeigt; hochgeladen und in
 * groß angesehen werden sie über "Skizzen/Fotos" im Auftragskopf.
 */
function KommentarSpalte({ kommentare, bilder, laedt, ichId, admin, nameVon, melde, auftragId, nachladen }) {
  /* Wegräumen darf nur, wer es hingeschrieben hat - sonst löscht jemand
     die Notiz eines Kollegen weg, auf die der sich noch verlässt. Der
     Admin darf alles. Alte Einträge ohne Namen ebenfalls nur der Admin. */
  const darfLoeschen = k => admin || (!!k.mitarbeiter_id && k.mitarbeiter_id === ichId);

  const [text, setText] = useState("");
  const [sendet, setSendet] = useState(false);
  const [loeschen, setLoeschen] = useState(null);

  async function senden() {
    if (!text.trim()) return;
    setSendet(true);
    const { error } = await db.from("kommentare").insert({
      auftrag_id: auftragId,
      mitarbeiter_id: ichId || null,
      text: text.trim()
    });
    setSendet(false);
    if (error) { melde("Speichern fehlgeschlagen: " + error.message, "bad"); return; }
    setText("");
    await nachladen();
  }

  async function wirklichLoeschen(k) {
    if (k.bild_pfad) await db.storage.from(BUCKET).remove([k.bild_pfad]);
    const { error } = await db.from("kommentare").delete().eq("id", k.id);
    setLoeschen(null);
    if (error) { melde("Löschen fehlgeschlagen: " + error.message, "bad"); return; }
    await nachladen();
    melde("Kommentar gelöscht.");
  }

  return (
    <aside className="bg-panel border border-line rounded-2xl flex flex-col lg:sticky lg:top-24
                      lg:max-h-[calc(100vh-8rem)] overflow-hidden">
      <div className="px-5 py-4 border-b border-line flex items-center gap-2.5">
        <span className="text-lg">💬</span>
        <h2 className="font-bold">Kommentare</h2>
        <span className="text-muted text-sm ml-auto">{laedt ? "…" : kommentare.length}</span>
      </div>

      {/* Eingabe oben: Das Neueste steht direkt darunter. */}
      <div className="px-5 py-4 border-b border-line">
        <textarea rows="2" value={text} onChange={e => setText(e.target.value)}
                  className={eingabeKlasse + " text-sm"}
                  placeholder="Notiz, Hinweis, Absprache…" />
        <div className="flex items-center gap-3 mt-2.5">
          <Knopf klein onClick={senden} disabled={sendet || !text.trim()}>
            {sendet ? "…" : "Hinzufügen"}
          </Knopf>
          <span className="text-muted text-xs">als {nameVon(ichId)}</span>
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-5 py-4 space-y-4">
        {laedt ? <p className="text-muted text-sm text-center py-4">lädt…</p> : null}
        {!laedt && kommentare.length === 0 ? (
          <p className="text-muted text-sm text-center py-6">
            Noch nichts notiert.<br />Skizzen und Fotos über den Knopf im Auftragskopf.
          </p>
        ) : null}

        {kommentare.map(k => (
          <div key={k.id} className="border-l-2 border-line2 pl-3.5">
            <div className="flex items-baseline gap-2 text-xs mb-1">
              <span className="font-semibold text-sm">
                {k.mitarbeiter_id ? nameVon(k.mitarbeiter_id) : "ohne Namen"}
              </span>
              <span className="text-muted">{datumZeitText(k.erstellt_am)}</span>
              {darfLoeschen(k) ? (
                <button onClick={() => setLoeschen(k)} title="Löschen"
                        className="ml-auto text-muted hover:text-bad underline">×</button>
              ) : null}
            </div>
            {k.text ? <p className="text-sm whitespace-pre-wrap">{k.text}</p> : null}
            {k.bild_pfad && bilder[k.id] ? (
              <a href={bilder[k.id]} target="_blank" rel="noopener noreferrer" className="block mt-2">
                <img src={bilder[k.id]} alt="Skizze"
                     className="w-full rounded-lg border border-line hover:border-accent transition" />
              </a>
            ) : null}
            {k.bild_pfad && !bilder[k.id] ? (
              <p className="text-muted text-xs mt-1">Bild wird geladen…</p>
            ) : null}
          </div>
        ))}
      </div>

      {loeschen ? (
        <LoeschDialog
          titel="Kommentar löschen"
          text={"Der Eintrag" + (loeschen.bild_pfad ? " samt Bild" : "") + " wird entfernt."}
          onJa={() => wirklichLoeschen(loeschen)}
          onSchliessen={() => setLoeschen(null)}
        />
      ) : null}
    </aside>
  );
}


/**
 * Skizzen und Fotos zum Auftrag: hochladen und groß ansehen.
 * Technisch dieselben Kommentare - nur die mit Bild.
 */
function SkizzenDialog({ kommentare, bilder, ichId, admin, nameVon, melde, auftragId, nachladen, onSchliessen }) {
  const darfLoeschen = k => admin || (!!k.mitarbeiter_id && k.mitarbeiter_id === ichId);

  const [datei, setDatei] = useState(null);
  const [text, setText] = useState("");
  const [sendet, setSendet] = useState(false);
  const [loeschen, setLoeschen] = useState(null);
  const dateiRef = useRef(null);

  const mitBild = kommentare.filter(k => k.bild_pfad);

  async function hochladen() {
    if (!datei) { melde("Bitte ein Bild wählen.", "bad"); return; }
    setSendet(true);
    try {
      const endung = (datei.name.split(".").pop() || "jpg").toLowerCase();
      const pfad = "kommentare/" + auftragId + "/" + Date.now() + "." + endung;
      const { error } = await db.storage.from(BUCKET).upload(pfad, datei, {
        contentType: datei.type || "image/jpeg", upsert: false
      });
      if (error) throw error;

      const { error: kFehler } = await db.from("kommentare").insert({
        auftrag_id: auftragId,
        mitarbeiter_id: ichId || null,
        text: text.trim() || null,
        bild_pfad: pfad
      });
      if (kFehler) throw kFehler;

      setDatei(null); setText("");
      if (dateiRef.current) dateiRef.current.value = "";
      await nachladen();
      melde("Bild hinzugefügt.");
    } catch (e) {
      melde("Hochladen fehlgeschlagen: " + (e.message || e), "bad");
    } finally {
      setSendet(false);
    }
  }

  async function wirklichLoeschen(k) {
    if (k.bild_pfad) await db.storage.from(BUCKET).remove([k.bild_pfad]);
    const { error } = await db.from("kommentare").delete().eq("id", k.id);
    setLoeschen(null);
    if (error) { melde("Löschen fehlgeschlagen: " + error.message, "bad"); return; }
    await nachladen();
    melde("Bild gelöscht.");
  }

  return (
    <Dialog titel="Skizzen & Fotos" unterzeile={mitBild.length + " zum Auftrag"}
            onSchliessen={onSchliessen} breit>
      {/* Hochladen */}
      <div className="bg-chip border border-line rounded-xl p-4 mb-6">
        {datei ? (
          <div className="flex flex-wrap items-center gap-3 bg-ok/10 border border-ok/40 rounded-xl px-4 py-3">
            <span className="text-lg">🖼</span>
            <span className="truncate mr-auto text-sm">{datei.name}</span>
            <button onClick={() => { setDatei(null); if (dateiRef.current) dateiRef.current.value = ""; }}
                    className="text-muted hover:text-bad text-sm underline px-2 min-h-11">entfernen</button>
          </div>
        ) : (
          <input ref={dateiRef} type="file" accept="image/*"
                 onChange={e => setDatei(e.target.files[0] || null)}
                 className="block w-full text-sm text-muted file:mr-4 file:py-3 file:px-5
                            file:rounded-xl file:border-0 file:bg-panel2 file:text-text
                            file:font-semibold file:cursor-pointer hover:file:bg-line" />
        )}

        <input className={eingabeKlasse + " mt-3"} value={text}
               onChange={e => setText(e.target.value)}
               placeholder="Bildunterschrift (optional)" />

        <div className="flex flex-wrap items-center gap-3 mt-3">
          <Knopf klein onClick={hochladen} disabled={sendet || !datei}>
            {sendet ? "Lädt hoch…" : "Hinzufügen"}
          </Knopf>
          <span className="text-muted text-xs">
            Am Tablet lässt sich auch direkt die Kamera wählen.
          </span>
        </div>
      </div>

      {/* Galerie */}
      {mitBild.length === 0 ? (
        <p className="text-muted text-center py-8">Noch keine Skizze und kein Foto.</p>
      ) : (
        <div className="grid gap-5 sm:grid-cols-2">
          {mitBild.map(k => (
            <div key={k.id} className="bg-chip border border-line rounded-xl overflow-hidden">
              {bilder[k.id] ? (
                <a href={bilder[k.id]} target="_blank" rel="noopener noreferrer">
                  <img src={bilder[k.id]} alt={k.text || "Skizze"}
                       className="w-full max-h-72 object-contain bg-black/30" />
                </a>
              ) : (
                <div className="h-40 flex items-center justify-center text-muted text-sm">lädt…</div>
              )}
              <div className="p-3.5">
                {k.text ? <p className="text-sm mb-2">{k.text}</p> : null}
                <div className="flex items-center gap-2 text-xs text-muted">
                  <span>{k.mitarbeiter_id ? nameVon(k.mitarbeiter_id) : "ohne Namen"}</span>
                  <span>{datumZeitText(k.erstellt_am)}</span>
                  {darfLoeschen(k) ? (
                    <button onClick={() => setLoeschen(k)}
                            className="ml-auto hover:text-bad underline">löschen</button>
                  ) : null}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {loeschen ? (
        <LoeschDialog
          titel="Bild löschen"
          text="Das Bild wird endgültig entfernt."
          onJa={() => wirklichLoeschen(loeschen)}
          onSchliessen={() => setLoeschen(null)}
        />
      ) : null}
    </Dialog>
  );
}


/* ---------- Detailansicht -------------------------------------------- */

function Detail({ auftragId, mitarbeiter, bereiche, bereich, ichId, admin, melde, onZurueck, onGeaendert }) {
  const derBereichName = (bereiche.find(b => b.schluessel === bereich) || {}).name || "diesen Bereich";
  const [auftrag, setAuftrag] = useState(null);
  const [positionen, setPositionen] = useState([]);
  const [buchungen, setBuchungen] = useState([]);
  const [laedt, setLaedt] = useState(true);
  const [dialog, setDialog] = useState(null);

  /* Kommentare liegen hier statt in den Unterbausteinen: Spalte und
     Skizzen-Dialog zeigen dieselben Daten, also wird auch nur einmal
     geladen und einmal nachgeladen. */
  const [kommentare, setKommentare] = useState([]);
  const [bilder, setBilder] = useState({});
  const [kLaedt, setKLaedt] = useState(true);

  /* Die Adresse des PDFs wird schon beim Laden geholt, damit der Knopf
     ein echter Link sein kann. Würde man sie erst beim Antippen holen,
     käme das Öffnen nach einem `await` - und Tablet-Browser blockieren
     das dann als ungewolltes Pop-up. */
  const [pdfUrl, setPdfUrl] = useState("");

  const ladeKommentare = useCallback(async () => {
    const { data, error } = await db.from("kommentare")
      .select("*").eq("auftrag_id", auftragId)
      .order("erstellt_am", { ascending: false });
    setKLaedt(false);
    if (error) { melde("Kommentare: " + error.message, "bad"); return; }
    setKommentare(data || []);

    /* Der Bucket ist privat - jedes Bild braucht eine befristete Adresse. */
    const mitBild = (data || []).filter(k => k.bild_pfad);
    if (mitBild.length === 0) { setBilder({}); return; }
    const { data: urls } = await db.storage.from(BUCKET)
      .createSignedUrls(mitBild.map(k => k.bild_pfad), 3600);
    const karte = {};
    (urls || []).forEach((u, i) => { if (u && u.signedUrl) karte[mitBild[i].id] = u.signedUrl; });
    setBilder(karte);
  }, [auftragId, melde]);

  useEffect(() => { ladeKommentare(); }, [ladeKommentare]);

  const laden = useCallback(async () => {
    try {
      const [a, p] = await Promise.all([
        db.from("v_auftrag_uebersicht").select("*").eq("id", auftragId).single(),
        db.from("positionen").select("*").eq("auftrag_id", auftragId)
          .order("pos_nr", { ascending: true, nullsFirst: false })
      ]);
      if (a.error) throw a.error;
      if (p.error) throw p.error;
      setAuftrag(a.data);
      setPositionen(p.data || []);

      if (a.data && a.data.dokument_pfad) {
        /* Acht Stunden - deckt eine Schicht ab, ohne dass der Link
           zwischendurch abläuft. */
        const { data: sig } = await db.storage.from(BUCKET)
          .createSignedUrl(a.data.dokument_pfad, 28800);
        setPdfUrl(sig && sig.signedUrl ? sig.signedUrl : "");
      } else {
        setPdfUrl("");
      }

      const ids = (p.data || []).map(x => x.id);
      if (ids.length > 0) {
        const { data: z, error: zFehler } = await db
          .from("zeitbuchungen").select("*").in("position_id", ids)
          .order("gebucht_am", { ascending: false });
        if (zFehler) throw zFehler;
        setBuchungen(z || []);
      } else {
        setBuchungen([]);
      }
    } catch (e) {
      melde("Laden fehlgeschlagen: " + (e.message || e), "bad");
    } finally {
      setLaedt(false);
    }
  }, [auftragId, melde]);

  useEffect(() => { laden(); }, [laden]);

  const nameVon = useCallback(id => {
    const m = mitarbeiter.find(x => x.id === id);
    return m ? m.name : "—";
  }, [mitarbeiter]);

  const minutenJePosition = useMemo(() => {
    const summe = {};
    buchungen.forEach(b => { summe[b.position_id] = (summe[b.position_id] || 0) + b.minuten; });
    return summe;
  }, [buchungen]);

  /* Sobald das erste Mal gebucht oder abgehakt wird, wandert der Auftrag
     von `neu` nach `in_arbeit`. Die App führt, sie blockiert nicht. */
  const inArbeitSetzen = useCallback(async () => {
    if (auftrag && auftrag.status === "neu") {
      await db.from("auftraege").update({ status: "in_arbeit" }).eq("id", auftragId);
    }
  }, [auftrag, auftragId]);

  async function nachAenderung() {
    await laden();
    await onGeaendert();
  }

  async function erledigtUmschalten(pos) {
    if (!ichId) { melde("Dafür oben rechts einen Namen wählen.", "bad"); return; }
    const neu = !pos.erledigt;
    const { error } = await db.from("positionen").update({
      erledigt: neu,
      erledigt_am: neu ? new Date().toISOString() : null,
      erledigt_von: neu ? ichId : null
    }).eq("id", pos.id);
    if (error) { melde("Fehler: " + error.message, "bad"); return; }
    if (neu) await inArbeitSetzen();
    await nachAenderung();
  }

  /* "Als erledigt markieren" gibt es nicht mehr - fertig ist ein Auftrag,
     wenn seine Positionen abgehakt sind. Bleibt nur das Archivieren, für
     alles, was nie fertig wird: Kunde springt ab, Auftrag storniert. */
  async function archivieren() {
    const { error } = await db.from("auftraege").update({ status: "archiviert" }).eq("id", auftragId);
    if (error) { melde("Fehler: " + error.message, "bad"); return; }
    melde("Auftrag ins Archiv verschoben.");
    await onZurueck();
  }

  async function zurueckAufsBoard() {
    const { error } = await db.from("auftraege").update({ status: "in_arbeit" }).eq("id", auftragId);
    if (error) { melde("Fehler: " + error.message, "bad"); return; }
    melde("Auftrag zurück auf dem Board.");
    await nachAenderung();
  }

  async function auftragLoeschen() {
    const { error } = await db.from("auftraege").delete().eq("id", auftragId);
    if (error) { melde("Löschen fehlgeschlagen: " + error.message, "bad"); return; }
    melde("Auftrag gelöscht.");
    await onZurueck();
  }

  async function positionLoeschen(pos) {
    const { error } = await db.from("positionen").delete().eq("id", pos.id);
    setDialog(null);
    if (error) { melde("Löschen fehlgeschlagen: " + error.message, "bad"); return; }
    melde("Position gelöscht.");
    await nachAenderung();
  }

  if (laedt) return <Lade text="Auftrag wird geladen…" />;
  if (!auftrag) return (
    <div>
      <Knopf art="geist" klein onClick={onZurueck}>← Zurück</Knopf>
      <p className="text-muted mt-6">Auftrag nicht gefunden.</p>
    </div>
  );

  /* Eine Position gehört dem eigenen Bereich, wenn sie ihn ausdrücklich
     trägt - oder keinen eigenen hat und der Auftrag dem eigenen gehört. */
  const gehoertMir = p => (p.bereich || auftrag.bereich) === bereich;

  const meine      = positionen.filter(p => p.ist_fertigung && gehoertMir(p));
  const fremde     = positionen.filter(p => p.ist_fertigung && !gehoertMir(p));
  const zukauf     = positionen.filter(p => !p.ist_fertigung);
  const alleFertig = meine.length > 0 && meine.every(p => p.erledigt);

  const bildAnzahl    = kommentare.filter(k => k.bild_pfad).length;
  const istArchiviert = auftrag.status === "archiviert";
  /* Gebucht und abgehakt wird, solange der Auftrag nicht im Archiv liegt.
     Ob er "fertig" ist, leitet sich aus den Positionen ab - dafür gibt es
     keinen Schalter mehr. */
  const istAktiv      = !istArchiviert;

  return (
    <div>
      <div className="flex flex-wrap items-center gap-4 mb-5">
        <Knopf art="geist" klein onClick={onZurueck}>← Zurück</Knopf>
        <BereichBadge schluessel={bereich} bereiche={bereiche} />
        {admin ? (
          <Knopf art="gefahr" klein className="ml-auto"
                 onClick={() => setDialog({ art: "auftragLoeschen" })}>
            Auftrag löschen
          </Knopf>
        ) : null}
      </div>

      {/* Rückfallebene: greift nur, wenn die Admin-Kennung in der
          Datenbank fehlt (Update-03 nicht gelaufen). */}
      {!ichId ? (
        <div className="bg-warn/10 border border-warn/40 rounded-2xl px-5 py-4 mb-5 text-sm">
          <b className="text-warn">Kein Name gewählt.</b>
          <span className="text-muted"> Ändern und Löschen geht, Zeiten buchen und
          Abhaken erst nach der Namenswahl oben rechts — sonst stünde der falsche
          Name in der Historie.</span>
        </div>
      ) : null}

      {/* Zwei Spalten: Auftrag links, laufende Kommentare rechts.
          Unterhalb von lg rutscht die Spalte unter den Auftrag. */}
      <div className="grid gap-5 lg:grid-cols-[minmax(0,1fr)_23rem] items-start">
      <div className="min-w-0">

      {/* Kopf */}
      <div className="bg-panel border border-line rounded-2xl p-6 mb-5">
        <div className="flex flex-wrap items-start justify-between gap-4">
          <div>
            <h1 className="text-2xl font-bold">{auftrag.beleg_nr || "ohne Beleg-Nr."}</h1>
            <p className="text-muted mt-1">{auftrag.kunde || "—"}</p>
            {auftrag.fahrzeug ? <p className="text-muted text-sm mt-0.5">🚐 {auftrag.fahrzeug}</p> : null}
            <div className="mt-3">
              <TerminZeile a={auftrag} gross />
            </div>
            {auftrag.notiz ? <p className="text-sm mt-3 bg-chip border border-line rounded-xl px-4 py-3">{auftrag.notiz}</p> : null}
          </div>
          <div className="text-right">
            <div className="text-3xl font-bold">{minutenText(auftrag.gebuchte_minuten)}</div>
            <div className="text-muted text-sm">gebucht gesamt</div>
          </div>
        </div>

        {auftrag.ueberfaellig ? (
          <div className="mt-4 bg-bad/15 border border-bad/50 rounded-xl px-4 py-3 text-sm">
            <b className="text-bad">Überfällig.</b>
            <span className="text-muted"> Der Abholtermin ist vorbei, hier ist aber noch nicht alles erledigt.</span>
          </div>
        ) : null}

        <div className="flex flex-wrap gap-3 mt-5">
          {!auftrag.dokument_pfad ? (
            <span className="text-muted text-sm self-center">Kein PDF hinterlegt.</span>
          ) : pdfUrl ? (
            /* Echter Link statt Knopf mit Skript - so blockiert kein
               Tablet-Browser das Öffnen. */
            <a href={pdfUrl} target="_blank" rel="noopener noreferrer"
               className="inline-flex items-center justify-center gap-2 rounded-xl font-semibold
                          transition select-none px-4 py-2.5 text-sm min-h-11
                          bg-panel2 border border-line2 text-text hover:border-accent">
              📄 Original-PDF ansehen
            </a>
          ) : (
            <span className="text-muted text-sm self-center">PDF wird vorbereitet…</span>
          )}
          <Knopf art="still" klein onClick={() => setDialog({ art: "skizzen" })}>
            🖼 Skizzen/Fotos
            {bildAnzahl > 0 ? <span className="opacity-70">({bildAnzahl})</span> : null}
          </Knopf>
          {istAktiv
            ? <Knopf art="geist" klein onClick={() => setDialog({ art: "position", pos: null })}>
                + Nachbestellung
              </Knopf>
            : null}
          {admin && istAktiv
            ? <Knopf art="still" klein onClick={() => setDialog({ art: "kopf" })}>
                ✎ Kopfdaten ändern
              </Knopf>
            : null}
        </div>
      </div>

      {alleFertig && istAktiv ? (
        <div className="bg-ok/10 border border-ok/40 rounded-2xl p-5 mb-5">
          <div className="font-bold text-ok">Für {derBereichName} ist hier alles erledigt.</div>
          <div className="text-muted text-sm mt-0.5">
            {fremde.length > 0
              ? "Andere Bereiche arbeiten noch am Auftrag."
              : "Der Auftrag steht im Board unter „Erledigt“."}
          </div>
        </div>
      ) : null}

      {/* Die eigenen Positionen - das, wofür der Kollege hier ist. */}
      <h2 className="flex flex-wrap items-center gap-2.5 text-sm font-bold text-muted tracking-wider uppercase mb-3">
        <span>Für {derBereichName}</span>
        <span className="opacity-70">
          ({meine.filter(p => p.erledigt).length}/{meine.length} erledigt)
        </span>
      </h2>
      <div className="space-y-3 mb-8">
        {meine.length === 0 ? (
          <p className="text-muted text-sm">
            Für diesen Bereich ist an diesem Auftrag nichts zu fertigen.
          </p>
        ) : null}
        {meine.map(p => (
          <PositionZeile key={p.id} p={p}
                         minuten={minutenJePosition[p.id] || 0}
                         buchungen={buchungen.filter(b => b.position_id === p.id)}
                         nameVon={nameVon}
                         istAktiv={istAktiv}
                         admin={admin}
                         onZeit={() => setDialog({ art: "zeit", pos: p })}
                         onBuchungen={() => setDialog({ art: "buchungen", pos: p })}
                         onBearbeiten={() => setDialog({ art: "position", pos: p })}
                         onLoeschen={() => setDialog({ art: "posLoeschen", pos: p })}
                         onErledigt={() => erledigtUmschalten(p)} />
        ))}
      </div>

      {/* Der Rest des Auftrags. Gedämpft und ohne Knöpfe: sichtbar als
          Zusammenhang, aber erkennbar nicht die eigene Arbeit. */}
      {fremde.length > 0 ? (
        <div className="mb-8">
          <h2 className="text-sm font-bold text-muted tracking-wider uppercase mb-3">
            Andere Bereiche ({fremde.filter(p => p.erledigt).length}/{fremde.length} erledigt)
          </h2>
          <div className="space-y-2">
            {fremde.map(p => (
              <div key={p.id}
                   className="bg-panel/40 border border-line/50 rounded-xl px-5 py-3.5
                              flex flex-wrap items-center gap-x-4 gap-y-2">
                <span className="text-muted font-mono text-sm w-6">{p.pos_nr}</span>
                <span className={"text-muted " + (p.erledigt ? "line-through" : "")}>
                  {p.bezeichnung}
                </span>
                {p.menge ? <span className="text-muted text-sm">{p.menge} {p.einheit || ""}</span> : null}
                <BereichBadge schluessel={p.bereich || auftrag.bereich} bereiche={bereiche} klein />
                {p.erledigt ? <span className="text-ok text-sm">✓</span> : null}
              </div>
            ))}
          </div>
        </div>
      ) : null}

      {/* Zukaufteile */}
      {zukauf.length > 0 ? (
        <div className="mb-8">
          <h2 className="text-sm font-bold text-muted tracking-wider uppercase mb-3">
            Zukaufteile ({zukauf.length}) · nur Information
          </h2>
          <div className="space-y-2">
            {zukauf.map(p => (
              <div key={p.id}
                   className="bg-panel/50 border border-line/60 border-dashed rounded-xl px-5 py-4
                              flex flex-wrap items-center gap-x-4 gap-y-2">
                <span className="text-muted text-lg">📦</span>
                <span className="text-muted font-mono text-sm">{p.pos_nr}</span>
                <span className="text-muted">{p.bezeichnung}</span>
                {p.menge ? <span className="text-muted text-sm">{p.menge} {p.einheit || ""}</span> : null}
                <KennzeichnungBadge art={p.kennzeichnung} notiz={p.kennzeichnung_notiz} />
                {admin && !istArchiviert ? (
                  <div className="ml-auto flex gap-3">
                    <button onClick={() => setDialog({ art: "position", pos: p })}
                            className="text-muted hover:text-text text-sm underline">
                      bearbeiten
                    </button>
                    <button onClick={() => setDialog({ art: "posLoeschen", pos: p })}
                            className="text-muted hover:text-bad text-sm underline">
                      löschen
                    </button>
                  </div>
                ) : null}
              </div>
            ))}
          </div>
        </div>
      ) : null}

      {/* Kein "Erledigt"-Schalter mehr - fertig wird ein Auftrag durch
          abgehakte Positionen. Bleibt das Archivieren für alles, was nie
          fertig wird. */}
      <div className="border-t border-line pt-6 flex flex-wrap gap-3 items-center">
        {istAktiv ? (
          <React.Fragment>
            <span className="text-muted text-sm mr-auto">
              Der Auftrag wandert von selbst nach „Erledigt“, sobald alle
              Positionen abgehakt sind.
            </span>
            <Knopf art="still" klein onClick={archivieren}>📦 Archivieren</Knopf>
          </React.Fragment>
        ) : null}

        {istArchiviert ? (
          <React.Fragment>
            <span className="text-muted text-sm mr-auto">Dieser Auftrag liegt im Archiv.</span>
            <Knopf art="geist" klein onClick={zurueckAufsBoard}>Zurück aufs Board</Knopf>
          </React.Fragment>
        ) : null}
      </div>

      </div>{/* Ende linke Spalte */}

      <KommentarSpalte kommentare={kommentare} bilder={bilder} laedt={kLaedt}
                       ichId={ichId} admin={admin} nameVon={nameVon} melde={melde}
                       auftragId={auftragId} nachladen={ladeKommentare} />
      </div>{/* Ende Zweispalter */}

      {dialog && dialog.art === "zeit" ? (
        <ZeitDialog pos={dialog.pos} ichId={ichId} ichName={nameVon(ichId)} melde={melde}
                    onSchliessen={() => setDialog(null)}
                    onGebucht={async () => { setDialog(null); await inArbeitSetzen(); await nachAenderung(); }} />
      ) : null}

      {dialog && dialog.art === "position" ? (
        <PositionDialog pos={dialog.pos} auftragId={auftragId}
                        bereiche={bereiche} bereich={bereich} regeln={[]}
                        naechsteNr={positionen.length + 1} melde={melde}
                        onSchliessen={() => setDialog(null)}
                        onGespeichert={async () => { setDialog(null); await nachAenderung(); }} />
      ) : null}

      {dialog && dialog.art === "buchungen" ? (
        <BuchungenDialog pos={dialog.pos}
                         buchungen={buchungen.filter(b => b.position_id === dialog.pos.id)}
                         mitarbeiter={mitarbeiter} nameVon={nameVon} melde={melde}
                         onSchliessen={() => setDialog(null)}
                         onGeaendert={nachAenderung} />
      ) : null}

      {dialog && dialog.art === "skizzen" ? (
        <SkizzenDialog kommentare={kommentare} bilder={bilder} ichId={ichId} admin={admin}
                       nameVon={nameVon} melde={melde} auftragId={auftragId}
                       nachladen={ladeKommentare}
                       onSchliessen={() => setDialog(null)} />
      ) : null}

      {dialog && dialog.art === "kopf" ? (
        <KopfDialog auftrag={auftrag} melde={melde}
                    onSchliessen={() => setDialog(null)}
                    onGespeichert={async () => { setDialog(null); await nachAenderung(); }} />
      ) : null}

      {dialog && dialog.art === "posLoeschen" ? (
        <LoeschDialog
          titel="Position löschen"
          text={"„" + dialog.pos.bezeichnung + "\" wird mit allen darauf gebuchten Zeiten entfernt."}
          onJa={() => positionLoeschen(dialog.pos)}
          onSchliessen={() => setDialog(null)}
        />
      ) : null}

      {dialog && dialog.art === "auftragLoeschen" ? (
        <LoeschDialog
          titel="Auftrag löschen"
          text={"Der Auftrag „" + (auftrag.beleg_nr || "ohne Beleg-Nr.") +
                "\" wird mit allen Positionen, Zeitbuchungen und Kommentaren entfernt."}
          onJa={auftragLoeschen}
          onSchliessen={() => setDialog(null)}
        />
      ) : null}
    </div>
  );
}


/** Kopfdaten nachträglich korrigieren - nur im Admin-Modus erreichbar. */
function KopfDialog({ auftrag, melde, onSchliessen, onGespeichert }) {
  const [f, setF] = useState({
    beleg_nr: auftrag.beleg_nr || "",
    kunde:    auftrag.kunde || "",
    fahrzeug: auftrag.fahrzeug || "",
    notiz:    auftrag.notiz || "",
    vor_ort_von: auftrag.vor_ort_von || "",
    vor_ort_bis: auftrag.vor_ort_bis || ""
  });
  const [speichert, setSpeichert] = useState(false);

  async function speichern() {
    setSpeichert(true);
    const { error } = await db.from("auftraege").update({
      beleg_nr: f.beleg_nr.trim() || null,
      kunde:    f.kunde.trim() || null,
      fahrzeug: f.fahrzeug.trim() || null,
      notiz:    f.notiz.trim() || null,
      vor_ort_von: f.vor_ort_von || null,
      vor_ort_bis: f.vor_ort_bis || null
    }).eq("id", auftrag.id);
    if (error) { melde("Speichern fehlgeschlagen: " + error.message, "bad"); setSpeichert(false); return; }
    melde("Kopfdaten aktualisiert.");
    await onGespeichert();
  }

  return (
    <Dialog titel="Kopfdaten ändern" onSchliessen={onSchliessen}>
      <div className="space-y-4">
        <Feld label="Beleg-Nr. (WSA)">
          <input className={eingabeKlasse} value={f.beleg_nr} autoFocus
                 onChange={e => setF({ ...f, beleg_nr: e.target.value })} />
        </Feld>
        <Feld label="Kunde">
          <input className={eingabeKlasse} value={f.kunde}
                 onChange={e => setF({ ...f, kunde: e.target.value })} />
        </Feld>
        <Feld label="Fahrzeug">
          <input className={eingabeKlasse} value={f.fahrzeug}
                 onChange={e => setF({ ...f, fahrzeug: e.target.value })} />
        </Feld>
        <div className="grid grid-cols-2 gap-3">
          <Feld label="Anlieferung">
            <DatumFeld wert={f.vor_ort_von}
                       onAendern={v => setF({ ...f, vor_ort_von: v })} />
          </Feld>
          <Feld label="Abholung">
            <DatumFeld wert={f.vor_ort_bis} min={f.vor_ort_von}
                       onAendern={v => setF({ ...f, vor_ort_bis: v })} />
          </Feld>
        </div>
        <Feld label="Notiz">
          <textarea rows="2" className={eingabeKlasse} value={f.notiz}
                    onChange={e => setF({ ...f, notiz: e.target.value })} />
        </Feld>
        <div className="flex gap-3 pt-1">
          <Knopf onClick={speichern} disabled={speichert} className="flex-1">
            {speichert ? "Speichert…" : "Speichern"}
          </Knopf>
          <Knopf art="geist" onClick={onSchliessen} disabled={speichert}>Abbrechen</Knopf>
        </div>
      </div>
    </Dialog>
  );
}


/**
 * Gebuchte Zeiten einer Position ändern oder löschen.
 * Bewusst für alle zugänglich, nicht nur für Admins: Wer sich beim
 * Buchen vertippt, soll das sofort selbst richtigstellen können.
 */
function BuchungenDialog({ pos, buchungen, mitarbeiter, nameVon, melde, onSchliessen, onGeaendert }) {
  const [bearbeite, setBearbeite] = useState(null);   // id der Buchung
  const [stunden, setStunden] = useState("");
  const [minuten, setMinuten] = useState("");
  const [notiz, setNotiz] = useState("");
  const [maId, setMaId] = useState("");
  const [loeschen, setLoeschen] = useState(null);
  const [arbeitet, setArbeitet] = useState(false);

  const summe = buchungen.reduce((s, b) => s + b.minuten, 0);

  function starteBearbeiten(b) {
    setBearbeite(b.id);
    setStunden(String(Math.floor(b.minuten / 60)));
    setMinuten(String(b.minuten % 60));
    setNotiz(b.notiz || "");
    setMaId(b.mitarbeiter_id);
  }

  async function speichern(b) {
    const gesamt = (Number(stunden) || 0) * 60 + (Number(minuten) || 0);
    if (gesamt <= 0) { melde("Die Zeit muss größer als null sein.", "bad"); return; }
    setArbeitet(true);
    const { error } = await db.from("zeitbuchungen").update({
      minuten: gesamt, notiz: notiz.trim() || null, mitarbeiter_id: maId
    }).eq("id", b.id);
    setArbeitet(false);
    if (error) { melde("Änderung fehlgeschlagen: " + error.message, "bad"); return; }
    setBearbeite(null);
    melde("Buchung auf " + minutenText(gesamt) + " geändert.");
    await onGeaendert();
  }

  async function wirklichLoeschen(b) {
    setArbeitet(true);
    const { error } = await db.from("zeitbuchungen").delete().eq("id", b.id);
    setArbeitet(false);
    setLoeschen(null);
    if (error) { melde("Löschen fehlgeschlagen: " + error.message, "bad"); return; }
    melde("Buchung gelöscht.");
    await onGeaendert();
  }

  return (
    <Dialog titel="Gebuchte Zeiten" unterzeile={pos.bezeichnung} onSchliessen={onSchliessen} breit>
      <div className="flex items-baseline gap-3 mb-5">
        <span className="text-3xl font-bold">{minutenText(summe)}</span>
        <span className="text-muted text-sm">
          aus {buchungen.length} {buchungen.length === 1 ? "Buchung" : "Buchungen"}
        </span>
      </div>

      {buchungen.length === 0 ? (
        <p className="text-muted text-center py-6">Auf diese Position wurde noch nichts gebucht.</p>
      ) : null}

      <div className="space-y-3">
        {buchungen.map(b => (
          <div key={b.id} className="bg-chip border border-line rounded-xl p-4">
            {bearbeite === b.id ? (
              <div className="space-y-3">
                <div className="grid grid-cols-2 gap-3">
                  <div className="flex items-center gap-2">
                    <input className={eingabeKlasse + " text-center text-xl"} inputMode="numeric"
                           value={stunden} onChange={e => setStunden(e.target.value)} />
                    <span className="text-muted text-sm">Std</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <input className={eingabeKlasse + " text-center text-xl"} inputMode="numeric"
                           value={minuten} onChange={e => setMinuten(e.target.value)} />
                    <span className="text-muted text-sm">Min</span>
                  </div>
                </div>
                <select value={maId} onChange={e => setMaId(e.target.value)} className={eingabeKlasse}>
                  {mitarbeiter.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                </select>
                <input className={eingabeKlasse} value={notiz} placeholder="Notiz (optional)"
                       onChange={e => setNotiz(e.target.value)} />
                <div className="flex gap-3">
                  <Knopf klein onClick={() => speichern(b)} disabled={arbeitet}>Übernehmen</Knopf>
                  <Knopf art="geist" klein onClick={() => setBearbeite(null)}>Abbrechen</Knopf>
                </div>
              </div>
            ) : (
              <div className="flex flex-wrap items-center gap-x-4 gap-y-2">
                <span className="text-xl font-bold w-24">{minutenText(b.minuten)}</span>
                <span className="text-muted">{nameVon(b.mitarbeiter_id)}</span>
                <span className="text-muted text-xs">{datumZeitText(b.gebucht_am)}</span>
                {b.notiz ? <span className="text-muted italic text-sm">„{b.notiz}"</span> : null}
                <div className="ml-auto flex gap-2">
                  <Knopf art="geist" klein onClick={() => starteBearbeiten(b)}>Ändern</Knopf>
                  <Knopf art="geist" klein onClick={() => setLoeschen(b)}>Löschen</Knopf>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>

      <Knopf art="still" className="mt-6 w-full" onClick={onSchliessen}>Schließen</Knopf>

      {loeschen ? (
        <LoeschDialog
          titel="Buchung löschen"
          text={minutenText(loeschen.minuten) + " von " + nameVon(loeschen.mitarbeiter_id) +
                " werden von dieser Position entfernt."}
          onJa={() => wirklichLoeschen(loeschen)}
          onSchliessen={() => setLoeschen(null)}
        />
      ) : null}
    </Dialog>
  );
}

              <span className="text-muted">{nameVon(b.mitarbeiter_id)}</span>
              <span className="text-muted text-xs">{datumZeitText(b.gebucht_am)}</span>
              {b.notiz ? <span className="text-muted italic w-full sm:w-auto">„{b.notiz}"</span> : null}
            </div>

      <div className="flex flex-wrap gap-3 mt-4 ml-10">

            <Knopf art={p.erledigt ? "geist" : "gut"} klein onClick={onErledigt}>
              {p.erledigt ? "↩ Doch nicht erledigt" : "✓ Erledigt"}

          </React.Fragment>
        ) : null}

        {/* Zeiten korrigieren darf jeder - Tippfehler beim Buchen soll

        {buchungen.length > 0 ? (
          <Knopf art="geist" klein onClick={onBuchungen}>⏲ Zeiten korrigieren</Knopf>
        ) : null}

        {admin ? (
          <React.Fragment>
            <Knopf art="still" klein onClick={onBearbeiten}>✎ Ändern</Knopf>
            <Knopf art="geist" klein onClick={onLoeschen}>Löschen</Knopf>
          </React.Fragment>
        ) : null}
      </div>
    </div>
  );
}

    setStunden(String(Math.floor(neu / 60)));

    if (gesamt <= 0) { melde("Bitte eine Zeit größer als null eingeben.", "bad"); return; }

      position_id: pos.id, mitarbeiter_id: ichId, minuten: gesamt, notiz: notiz.trim() || null
    });

  return (
    <Dialog titel="Zeit buchen" unterzeile={pos.bezeichnung} onSchliessen={onSchliessen}>

        <div>
          <span className="block text-xs text-muted mb-1.5 font-medium">Dauer</span>
          <div className="grid grid-cols-2 gap-3">
            <div className="flex items-center gap-2">
              <input className={eingabeKlasse + " text-center text-xl"} inputMode="numeric"
                     placeholder="0" value={stunden} onChange={e => setStunden(e.target.value)} />
              <span className="text-muted text-sm">Std</span>

            <div className="flex items-center gap-2">
              <input className={eingabeKlasse + " text-center text-xl"} inputMode="numeric"
                     placeholder="0" value={minuten} onChange={e => setMinuten(e.target.value)} />
              <span className="text-muted text-sm">Min</span>
            </div>
          </div>
          <div className="flex flex-wrap gap-2 mt-3">
            {[15, 30, 60, 120].map(m => (
              <button key={m} onClick={() => schnell(m)}

              zurücksetzen

          <div className="text-center text-2xl font-bold mt-4">{minutenText(gesamt)}</div>
        </div>

        <Feld label="Notiz (optional)">
          <input className={eingabeKlasse} value={notiz} onChange={e => setNotiz(e.target.value)}
                 placeholder="z. B. Nacharbeit Schweißnaht" />
        </Feld>

        <div className="flex gap-3 pt-1">
          <Knopf onClick={buchen} disabled={speichert} className="flex-1">
            {speichert ? "Bucht…" : "Buchen"}
          </Knopf>
          <Knopf art="geist" onClick={onSchliessen} disabled={speichert}>Abbrechen</Knopf>
        </div>
      </div>
    </Dialog>
  );
}


/**
 * Position anlegen (Nachbestellung) oder bearbeiten.
 * Beim Bearbeiten wird die Kennzeichnung auf `geaendert` gesetzt, sofern
 * es nicht ohnehin schon eine Nachbestellung ist - so bleibt sichtbar,
 * dass sich gegenüber dem Original etwas verschoben hat.
 */
function PositionDialog({ pos, auftragId, bereiche, bereich, naechsteNr, melde, onSchliessen, onGespeichert }) {
  const neu = !pos;
  const [posBereich, setPosBereich] = useState(pos && pos.bereich ? pos.bereich : "");
  const [f, setF] = useState({
    bezeichnung:   pos ? pos.bezeichnung : "",
    beschreibung:  pos && pos.beschreibung ? pos.beschreibung : "",
    menge:         pos && pos.menge != null ? String(pos.menge) : "1",
    einheit:       pos && pos.einheit ? pos.einheit : "Stk",
    ist_fertigung: pos ? pos.ist_fertigung : true,
    notiz:         pos && pos.kennzeichnung_notiz ? pos.kennzeichnung_notiz : ""
  });
  const [alsGeaendert, setAlsGeaendert] = useState(!neu && pos.kennzeichnung === "original");
  const [speichert, setSpeichert] = useState(false);

  async function speichern() {
    if (!f.bezeichnung.trim()) { melde("Bitte eine Bezeichnung angeben.", "bad"); return; }
    setSpeichert(true);

    const werte = {
      bezeichnung:   f.bezeichnung.trim(),
      beschreibung:  f.beschreibung.trim() || null,
      menge:         f.menge ? Number(String(f.menge).replace(",", ".")) : null,
      einheit:       f.einheit.trim() || null,
      ist_fertigung: f.ist_fertigung,
      bereich:       posBereich || null,
      kennzeichnung_notiz: f.notiz.trim() || null
    };

    let error;
    if (neu) {
      werte.auftrag_id = auftragId;
      werte.pos_nr = naechsteNr;
      werte.kennzeichnung = "neu";
      ({ error } = await db.from("positionen").insert(werte));
    } else {
      if (pos.kennzeichnung === "original" && alsGeaendert) werte.kennzeichnung = "geaendert";
      ({ error } = await db.from("positionen").update(werte).eq("id", pos.id));
    }

    if (error) { melde("Speichern fehlgeschlagen: " + error.message, "bad"); setSpeichert(false); return; }
    melde(neu ? "Nachbestellung ergänzt." : "Position aktualisiert.");
    await onGespeichert();
  }

  return (
    <Dialog titel={neu ? "Nachbestellung ergänzen" : "Position ändern"}
            unterzeile={neu ? "Wird auffällig als Nachbestellung markiert." : pos.bezeichnung}
            onSchliessen={onSchliessen}>
      <div className="space-y-5">
        <Feld label="Bezeichnung">
          <input className={eingabeKlasse} value={f.bezeichnung} autoFocus
                 onChange={e => setF({ ...f, bezeichnung: e.target.value })} />
        </Feld>

        <div className="grid grid-cols-2 gap-3">
          <Feld label="Menge">
            <input className={eingabeKlasse} inputMode="decimal" value={f.menge}
                   onChange={e => setF({ ...f, menge: e.target.value })} />
          </Feld>
          <Feld label="Einheit">
            <input className={eingabeKlasse} value={f.einheit}
                   onChange={e => setF({ ...f, einheit: e.target.value })} />
          </Feld>
        </div>

        <Feld label="Beschreibung (optional)">
          <textarea rows="2" className={eingabeKlasse} value={f.beschreibung}
                    onChange={e => setF({ ...f, beschreibung: e.target.value })} />
        </Feld>

        <div>
          <span className="block text-xs text-muted mb-1.5 font-medium">Art</span>
          <div className="flex gap-2">
            <button onClick={() => setF({ ...f, ist_fertigung: true })}
                    className={"px-5 py-3 min-h-12 rounded-xl text-sm font-semibold border transition " +
                      (f.ist_fertigung ? "bg-accent/15 border-accent text-accent"
                                       : "border-line2 text-muted")}>
              🔧 Fertigung
            </button>
            <button onClick={() => setF({ ...f, ist_fertigung: false })}
                    className={"px-5 py-3 min-h-12 rounded-xl text-sm font-semibold border transition " +
                      (!f.ist_fertigung ? "bg-muted/15 border-muted text-text"
                                        : "border-line2 text-muted")}>
              📦 Zukaufteil
            </button>
          </div>
        </div>

        <Feld label="Wer macht das?"
              hinweis="Leer bedeutet: der Bereich des Auftrags. Nur umstellen, wenn ein anderer Bereich die Position fertigt.">
          <select value={posBereich} onChange={e => setPosBereich(e.target.value)}
                  className={eingabeKlasse}>
            <option value="">— Bereich des Auftrags —</option>
            {bereiche.map(b => (
              <option key={b.schluessel} value={b.schluessel}>{b.name}</option>
            ))}
          </select>
        </Feld>

        <Feld label="Vermerk (optional)"
              hinweis={neu ? "Erscheint neben dem Etikett, z. B. „Nachbestellung 12.08.“"
                           : "z. B. „Menge von 2 auf 4 erhöht“"}>
          <input className={eingabeKlasse} value={f.notiz}
                 onChange={e => setF({ ...f, notiz: e.target.value })} />
        </Feld>

        {!neu && pos.kennzeichnung === "original" ? (
          <label className="flex items-start gap-3 bg-chip border border-line rounded-xl p-4 cursor-pointer">
            <input type="checkbox" checked={alsGeaendert} className="mt-1 w-5 h-5 accent-[#ef4444]"
                   onChange={e => setAlsGeaendert(e.target.checked)} />
            <span className="text-sm">
              <b>Als „Geändert" markieren</b>
              <span className="block text-muted mt-0.5">
                Setzt ein auffälliges rotes Etikett an die Position, damit die Abweichung
                vom Original in der Werkstatt sofort auffällt.
              </span>
            </span>
          </label>
        ) : null}

        <div className="flex gap-3 pt-1">
          <Knopf onClick={speichern} disabled={speichert} className="flex-1">
            {speichert ? "Speichert…" : "Speichern"}
          </Knopf>
          <Knopf art="geist" onClick={onSchliessen} disabled={speichert}>Abbrechen</Knopf>
        </div>
      </div>
    </Dialog>
  );
}


/* ---------- Start ---------------------------------------------------- */

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<Anwendung />);
} catch (e) {
  document.getElementById("fehler").style.display = "block";
  document.getElementById("fehlerText").textContent = e.message || String(e);
}
</script>
</body>
</html>
